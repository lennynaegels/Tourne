  let current = null;
  let origin = 'integre';   // 'import' | 'dépôt' | 'secours'

  /* ── Validation ───────────────────────── */

  /* On refuse un fichier plutôt que de laisser l'app
     tourner sur des valeurs incohérentes. */
  function validate(obj) {
    const errs = [];

    if (!obj || typeof obj !== 'object') { errs.push('Le fichier ne contient pas d\'objet JSON.'); return errs; }
    if (obj.schema !== 1) errs.push(`Version de schéma non reconnue (attendu 1, reçu ${obj.schema}).`);
    if (!Array.isArray(obj.regimes) || !obj.regimes.length) errs.push('Aucun régime défini.');

    (obj.regimes || []).forEach((r, i) => {
      const at = `Régime ${i + 1}`;
      if (!r.id)    errs.push(`${at} : identifiant manquant.`);
      if (!r.label) errs.push(`${at} : libellé manquant.`);
      ['cotisation', 'abattement', 'plafondCA'].forEach(k => {
        if (typeof r[k] !== 'number' || r[k] < 0) errs.push(`${at} : « ${k} » doit être un nombre positif.`);
      });
      if (r.cotisation > 100) errs.push(`${at} : taux de cotisation supérieur à 100 %.`);
      if (r.abattement > 100) errs.push(`${at} : abattement supérieur à 100 %.`);
    });

    if (!obj.declaration || typeof obj.declaration !== 'object') errs.push('Bloc « declaration » manquant.');
    else if (!Array.isArray(obj.declaration.echeancesTrimestrielles)) errs.push('Échéances trimestrielles manquantes.');

    ['parcours', 'obligations', 'fiches'].forEach(k => {
      if (obj[k] != null && !Array.isArray(obj[k])) errs.push(`« ${k} » doit être une liste.`);
    });

    return errs;
  }

  function normalize(obj) {
    const o = JSON.parse(JSON.stringify(obj));
    o.parcours    = o.parcours    || [];
    o.obligations = o.obligations || [];
    o.fiches      = o.fiches      || [];
    o.acre        = o.acre        || FALLBACK.acre;
    o.plafonds    = o.plafonds    || FALLBACK.plafonds;
    o.sources     = o.sources     || [];
    return o;
  }

  /* ── Chargement ───────────────────────── */
  async function init() {
    // 1. Un fichier importé prime toujours.
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (!validate(parsed).length) {
          current = normalize(parsed);
          origin = 'import';
          return current;
        }
      }
    } catch (e) { /* import corrompu : on continue */ }

    // 2. Le fichier livré avec le dépôt.
    try {
      const res = await fetch('reglementation.json', { cache: 'no-cache' });
      if (res.ok) {
        const parsed = await res.json();
        if (!validate(parsed).length) {
          current = normalize(parsed);
          origin = 'dépôt';
          return current;
        }
      }
    } catch (e) { /* hors ligne au tout premier lancement */ }

    // 3. Secours.
    current = normalize(FALLBACK);
    origin = 'integre';
    return current;
  }

  /* ── Import utilisateur ───────────────── */
  function apply(text) {
    let parsed;
    try {
      parsed = typeof text === 'string' ? JSON.parse(text) : text;
    } catch (e) {
      throw new Error('Le fichier n\'est pas du JSON valide.');
    }
    const errs = validate(parsed);
    if (errs.length) throw new Error(errs.slice(0, 3).join('\n'));

    localStorage.setItem(KEY, JSON.stringify(parsed));
    current = normalize(parsed);
    origin = 'import';
    return current;
  }

  function reset() {
    localStorage.removeItem(KEY);
  }

  /* ── Lecture ──────────────────────────── */
  function all() { return current || normalize(FALLBACK); }

  function regimes() { return all().regimes; }

  function regime(id) {
    const list = regimes();
    return list.find(r => r.id === id) || list.find(r => r.defaut) || list[0];
  }


  /* Taux réellement appliqué : le régime, minoré par l'ACRE
     si elle est active. Une seule source de vérité. */
  function effectiveCotisation(regimeId, acreActive) {
    const r = regime(regimeId);
    const a = all().acre || {};
    if (!acreActive || !a.exonerationPct) return r.cotisation;
    return Math.round(r.cotisation * (1 - a.exonerationPct / 100) * 10) / 10;
  }

  function abattement(regimeId) { return regime(regimeId).abattement; }

  function meta() {
    const a = all();
    return {
      version: a.version,
      verifiedOn: a.verifiedOn,
      label: a.label,
      sources: a.sources,
      origin,
      ageDays: a.verifiedOn ? Math.floor((Date.now() - new Date(a.verifiedOn)) / 86400000) : null
    };
  }

  /* Un barème de plus d'un an mérite un coup d'œil :
     les taux du régime micro sont révisés chaque janvier. */
  function isStale() {
    const m = meta();
    return m.ageDays == null || m.ageDays > 365;
  }

  return { init, apply, reset, validate, all, regimes, regime,
           effectiveCotisation, abattement, meta, isStale, FALLBACK };

})();


/* ═══════════════════════════════════════════
   calc.js — toute l'arithmétique de l'app
   Un seul endroit pour l'argent : si un chiffre
   est faux, c'est ici qu'il faut regarder.
   ═══════════════════════════════════════════ */

const Calc = (() => {

  /* ── Formatage ────────────────────────── */
  function eur(n, decimals = 2) {
    if (n == null || isNaN(n)) return '—';
    return n.toFixed(decimals).replace('.', ',');
  }

  function km(n) {
    if (n == null || isNaN(n)) return '—';
    return n.toFixed(2).replace('.', ',');
  }

  function hms(ms) {
    if (!ms || ms < 0) ms = 0;
    const t = Math.floor(ms / 1000);
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    const pad = v => String(v).padStart(2, '0');
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  function hoursLabel(ms) {
    const h = ms / 3600000;
    if (h < 1) return Math.round(ms / 60000) + ' min';
    return (Math.round(h * 10) / 10).toString().replace('.', ',') + ' h';
  }

  function dayLabel(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date(Date.now() - 86400000);
    const same = (a, b) => a.toDateString() === b.toDateString();
    if (same(d, today)) return "Aujourd'hui";
    if (same(d, yest))  return 'Hier';
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' });
  }

  function clock(ts) {
    return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  /* ── Économie d'une course ────────────── */

  /* Le brut d'une course = prix payé par la plateforme + pourboire.
     Le net déduit les cotisations sociales (assises sur le CA
     encaissé, pas sur le bénéfice) et le coût kilométrique réel. */
  function courseNet(course, s) {
    const gross = (course.amount || 0) + (course.tip || 0);
    const social = gross * (s.cotisationRate / 100);
    const vehicle = (course.km || 0) * s.costPerKm;
    return {
      gross,
      social,
      vehicle,
      net: gross - social - vehicle,
      perKm: course.km > 0 ? gross / course.km : null
    };
  }

  /* Verdict avant acceptation. On raisonne sur le net estimé
     ramené à l'heure, parce que c'est le seul chiffre qui
     permet de comparer deux offres de longueurs différentes. */
  function judge(amount, kmDist, s) {
    if (!amount || !kmDist || kmDist <= 0) return null;

    const perKm = amount / kmDist;
    const social = amount * (s.cotisationRate / 100);
    const vehicle = kmDist * s.costPerKm;
    const net = amount - social - vehicle;

    // Distance réellement parcourue : aller, plus le retour si l'option est active.
    const traveled = s.countReturn ? kmDist * 1.5 : kmDist;
    const minutes = (traveled / s.avgSpeed) * 60 + 4; // +4 min de prise en charge au resto
    const perHour = net / (minutes / 60);

    let level;
    if (amount < s.minFare || perKm < s.thresholdPerKm * 0.85) level = 'no';
    else if (perKm < s.thresholdPerKm || perHour < s.hourlyGoal) level = 'mid';
    else level = 'go';

    const word = level === 'go' ? 'À prendre'
               : level === 'mid' ? 'Limite'
               : 'À laisser';

    return { perKm, net, social, vehicle, minutes, perHour, level, word };
  }

  /* ── Agrégats ─────────────────────────── */
  function summarize(courses, s, elapsedMs) {
    const t = { n: courses.length, gross: 0, social: 0, vehicle: 0, net: 0, km: 0, provision: 0 };

    courses.forEach(c => {
      const r = courseNet(c, s);
      t.gross   += r.gross;
      t.social  += r.social;
      t.vehicle += r.vehicle;
      t.net     += r.net;
      t.km      += c.km || 0;
    });

    t.provision = t.gross * (s.provisionRate / 100);
    t.perKm     = t.km > 0 ? t.gross / t.km : null;
    t.avg       = t.n > 0 ? t.gross / t.n : null;

    if (elapsedMs && elapsedMs > 60000) {
      const h = elapsedMs / 3600000;
      t.netPerHour   = t.net / h;
      t.grossPerHour = t.gross / h;
      t.perHourGap   = t.netPerHour - s.hourlyGoal;
    } else {
      t.netPerHour = null;
      t.grossPerHour = null;
      t.perHourGap = null;
    }
    return t;
  }

  /* Durée totale travaillée sur un ensemble de shifts. */
  function workedMs(sessions) {
    return sessions.reduce((sum, s) => sum + ((s.end || Date.now()) - s.start), 0);
  }

  function sameDay(ts, ref) {
    const a = new Date(ts), b = new Date(ref);
    return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
  }

  function todayCourses(courses) {
    const now = Date.now();
    return courses.filter(c => sameDay(c.start, now));
  }

  function todaySessions(sessions) {
    const now = Date.now();
    return sessions.filter(s => sameDay(s.start, now));
  }

  /* ── Analyse des créneaux ─────────────── */

  /* Regroupe le net par heure de la journée, pour révéler
     les créneaux qui rapportent vraiment. */
  function byHour(courses, s) {
    const buckets = Array.from({ length: 24 }, () => ({ net: 0, n: 0 }));
    courses.forEach(c => {
      const h = new Date(c.start).getHours();
      buckets[h].net += courseNet(c, s).net;
      buckets[h].n++;
    });
    return buckets;
  }

  function byWeekday(courses, s) {
    // 0 = lundi … 6 = dimanche
    const names = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    const buckets = names.map(name => ({ name, net: 0, n: 0 }));
    courses.forEach(c => {
      const js = new Date(c.start).getDay();      // 0 = dimanche
      const idx = (js + 6) % 7;                   // → 0 = lundi
      buckets[idx].net += courseNet(c, s).net;
      buckets[idx].n++;
    });
    return buckets;
  }

  function sinceDays(courses, days) {
    if (days >= 9999) return courses.slice();
    const cut = Date.now() - days * 86400000;
    return courses.filter(c => c.start >= cut);
  }

  /* ── Distance ─────────────────────────── */

  /* Haversine — distance à vol d'oiseau entre deux points GPS.
     Sur des segments courts (une poignée de secondes), l'écart
     avec la distance routière est négligeable et s'accumule bien. */
  function haversine(a, b) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat);
    const dLon = toRad(b.lon - a.lon);
    const la1 = toRad(a.lat), la2 = toRad(b.lat);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }


  /* ── Objectif de chiffre ──────────────────

     Le principe : on ne fige jamais un montant journalier.
     À chaque consultation on repart de ce qu'il reste à faire
     et du nombre de jours travaillables restants. Une journée
     sans course relève automatiquement les suivantes ; une
     grosse journée les allège d'autant.
     ──────────────────────────────────────── */

  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
         + '-' + String(d.getDate()).padStart(2, '0');
  }

  function parseDate(iso) {
    if (!iso) return null;
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? null : d;
  }

  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  /* Nombre de jours travaillables dans un intervalle, bornes incluses. */
  function workDays(from, to, days) {
    if (to < from) return 0;
    let n = 0, guard = 0;
    const cur = midnight(from), end = midnight(to);
    while (cur <= end && guard++ < 4000) {
      if (days.indexOf(cur.getDay()) !== -1) n++;
      cur.setDate(cur.getDate() + 1);
    }
    return n;
  }

  /* Date atteinte après n jours travaillables. */
  function addWorkDays(from, n, days) {
    const cur = midnight(from);
    let left = n, guard = 0;
    if (days.indexOf(cur.getDay()) !== -1) left--;   // le jour de départ compte s'il est travaillable
    while (left > 0 && guard++ < 4000) {
      cur.setDate(cur.getDate() + 1);
      if (days.indexOf(cur.getDay()) !== -1) left--;
    }
    return cur;
  }

  function goalStatus(courses, s) {
    if (!s.goalEnabled || !s.goalAmount || s.goalAmount <= 0) return null;

    const now = new Date();
    const y = now.getFullYear();
    const start = parseDate(s.goalStart) || new Date(y, 0, 1);
    const end   = parseDate(s.goalEnd)   || new Date(y, 11, 31);
    if (end < start) return null;

    const days = (s.goalDays && s.goalDays.length) ? s.goalDays : [0, 1, 2, 3, 4, 5, 6];
    const today = midnight(now);
    const endMs = new Date(end.getFullYear(), end.getMonth(), end.getDate(), 23, 59, 59).getTime();

    // Ce qui compte : brut encaissé, ou net après charges.
    const value = c => s.goalBasis === 'net'
      ? courseNet(c, s).net
      : (c.amount || 0) + (c.tip || 0);

    const inRange = courses.filter(c => c.start >= start.getTime() && c.start <= endMs);
    const done = inRange.reduce((sum, c) => sum + value(c), 0);

    const remain = Math.max(0, s.goalAmount - done);
    const pct = Math.min(100, (done / s.goalAmount) * 100);
    const reached = done >= s.goalAmount;
    const finished = today.getTime() > end.getTime();

    // Jours restants, aujourd'hui compris s'il est travaillable.
    const fromDay = today < start ? start : today;
    const daysLeft = finished ? 0 : workDays(fromDay, end, days);
    const perDay = (!finished && !reached && daysLeft > 0) ? remain / daysLeft : null;

    // Où l'on devrait en être si le rythme avait été régulier.
    const totalDays = workDays(start, end, days);
    const elapsed = today <= start ? 0
      : workDays(start, new Date(Math.min(today.getTime() - 86400000, end.getTime())), days);
    const expected = totalDays > 0 ? s.goalAmount * elapsed / totalDays : 0;
    const ahead = done - expected;

    // Aujourd'hui
    const isWorkDay = days.indexOf(today.getDay()) !== -1;
    const todayDone = inRange.filter(c => sameDay(c.start, now)).reduce((sum, c) => sum + value(c), 0);
    const todayTarget = (isWorkDay && perDay != null) ? perDay : 0;
    const todayLeft = Math.max(0, todayTarget - todayDone);
    const todayPct = todayTarget > 0 ? Math.min(100, (todayDone / todayTarget) * 100) : (todayDone > 0 ? 100 : 0);

    // Projection au rythme réellement tenu jusqu'ici.
    const workedDates = {};
    inRange.forEach(c => { workedDates[new Date(c.start).toDateString()] = 1; });
    const nbWorked = Object.keys(workedDates).length;
    const avgPerWorkedDay = nbWorked ? done / nbWorked : 0;
    const projection = done + avgPerWorkedDay * daysLeft;

    let etaDate = null;
    if (!reached && avgPerWorkedDay > 0) {
      const need = Math.ceil(remain / avgPerWorkedDay);
      if (need <= 3000) etaDate = addWorkDays(fromDay, need, days);
    }

    return {
      amount: s.goalAmount, basis: s.goalBasis, start, end, days,
      done, remain, pct, reached, finished,
      daysLeft, totalDays, elapsed, perDay,
      expected, ahead,
      isWorkDay, todayDone, todayTarget, todayLeft, todayPct,
      nbWorked, avgPerWorkedDay, projection, etaDate,
      atteignable: etaDate ? etaDate.getTime() <= end.getTime() : null
    };
  }

  return {
    eur, km, hms, hoursLabel, dayLabel, clock,
    goalStatus, workDays, isoDate, parseDate,
    courseNet, judge, summarize, workedMs,
    todayCourses, todaySessions, sameDay,
    byHour, byWeekday, sinceDays, haversine
  };

})();


/* ═══════════════════════════════════════════
   tracker.js — GPS, carte et distance
   ═══════════════════════════════════════════ */

const Tracker = (() => {

  let map = null;
  let meMarker = null;
  let trail = null;

  let watchId = null;
  let wakeLock = null;

  let lastFix = null;      // dernier point retenu
  let distance = 0;        // mètres cumulés sur la course en cours
  let recording = false;
  let followMe = true;

  const listeners = [];

  /* Filtres anti-dérive. Un GPS immobile « saute » de
     quelques mètres en permanence ; sans ces garde-fous
     on facturerait des kilomètres fantômes. */
  const MAX_ACCURACY = 35;   // m — au-delà, le point est ignoré
  const MIN_STEP     = 6;    // m — en-dessous, c'est du bruit
  const MAX_SPEED    = 35;   // m/s — au-delà, c'est une aberration

  function on(fn) { listeners.push(fn); }
  function emit() { listeners.forEach(fn => fn({ distance, lastFix, recording })); }

  /* ── Carte ────────────────────────────── */

  /* La carte est un confort, pas une dépendance : si la
     bibliothèque ou les tuiles ne répondent pas, tout le
     reste de l'application continue de fonctionner. */

  let tileErrors = 0;
  let tilesOk = 0;
  let mapState = 'en attente';
  let retries = 0;

  const TILE_SOURCES = [
    { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', nom: 'CARTO' },
    { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      attribution: '&copy; OpenStreetMap', subdomains: 'abc', nom: 'OpenStreetMap' }
  ];
  let sourceIndex = 0;
  let tileLayer = null;

  function mapNotice(txt) {
    const el = document.getElementById('map-notice');
    if (!el) return;
    if (!txt) { el.hidden = true; return; }
    el.textContent = txt;
    el.hidden = false;
  }

  function addTiles() {
    const src = TILE_SOURCES[sourceIndex];
    if (tileLayer) map.removeLayer(tileLayer);
    tileErrors = 0;
    tileLayer = L.tileLayer(src.url, {
      attribution: src.attribution, maxZoom: 19, subdomains: src.subdomains, crossOrigin: true
    });
    tileLayer.on('load', () => { tilesOk++; mapState = 'carte ' + src.nom; mapNotice(''); });
    tileLayer.on('tileload', () => { tilesOk++; mapNotice(''); });
    tileLayer.on('tileerror', () => {
      tileErrors++;
      // Deux sources tentées : au-delà, on cesse d'insister.
      if (tileErrors === 6 && sourceIndex < TILE_SOURCES.length - 1) {
        sourceIndex++;
        mapNotice('Fond de carte indisponible, tentative sur une autre source…');
        addTiles();
      } else if (tileErrors > 12 && tilesOk === 0) {
        mapState = 'tuiles injoignables';
        mapNotice("Fond de carte injoignable. Le suivi GPS et les kilomètres fonctionnent quand même.");
      }
    });
    tileLayer.addTo(map);
  }

  function initMap() {
    if (map) return;

    // La bibliothèque peut arriver après le premier appel :
    // on retente quelques fois avant d'abandonner.
    if (typeof L === 'undefined') {
      if (retries++ < 12) { setTimeout(initMap, 500); mapState = 'chargement…'; return; }
      mapState = 'bibliothèque non chargée';
      mapNotice("La carte n'a pas pu être chargée. Tout le reste de l'application fonctionne : le GPS mesure les kilomètres normalement.");
      return;
    }

    try {
      map = L.map('map', { zoomControl: false, attributionControl: true, preferCanvas: true })
             .setView([46.6, 2.4], 5);   // France, remplacé au premier point GPS

      addTiles();

      trail = L.polyline([], { color: '#FFB627', weight: 5, opacity: .9,
                               lineJoin: 'round', lineCap: 'round' }).addTo(map);

      const icon = L.divIcon({ className: '', html: '<div class="me-dot"></div>',
                               iconSize: [16, 16], iconAnchor: [8, 8] });
      meMarker = L.marker([46.6, 2.4], { icon, interactive: false }).addTo(map);

      map.on('dragstart', () => { followMe = false; });
      mapState = 'prête';
    } catch (e) {
      mapState = 'erreur : ' + e.message;
      mapNotice("La carte n'a pas pu s'afficher. Le reste de l'application fonctionne normalement.");
    }
  }

  function recenter() {
    followMe = true;
    if (map && lastFix) map.setView([lastFix.lat, lastFix.lon], 16, { animate: true });
  }

  function invalidate() {
    if (map) setTimeout(() => map.invalidateSize(), 60);
  }

  /* ── Suivi de position ────────────────── */
  function onFix(pos) {
    const fix = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude,
      acc: pos.coords.accuracy,
      t: pos.timestamp
    };

    if (meMarker) meMarker.setLatLng([fix.lat, fix.lon]);
    if (map && followMe) map.setView([fix.lat, fix.lon], Math.max(map.getZoom(), 16), { animate: true });

    if (fix.acc != null && fix.acc > MAX_ACCURACY) { lastFix = lastFix || fix; return; }

    if (recording && lastFix) {
      const d = Calc.haversine(lastFix, fix);
      const dt = Math.max((fix.t - lastFix.t) / 1000, 0.5);
      const speed = d / dt;
      if (d >= MIN_STEP && speed <= MAX_SPEED) {
        distance += d;
        if (trail) trail.addLatLng([fix.lat, fix.lon]);
        lastFix = fix;
        emit();
        return;
      }
      if (d < MIN_STEP) return;      // on garde l'ancien point de référence
    }

    lastFix = fix;
    emit();
  }

  function onFixError(err) {
    const el = document.getElementById('gps-warn');
    if (!el) return;
    const msg = err.code === 1
      ? "Localisation refusée. Autorise-la dans les réglages du navigateur pour que les kilomètres se comptent tout seuls."
      : "Signal GPS indisponible pour l'instant. Tu peux saisir les kilomètres à la main.";
    el.textContent = msg;
    el.hidden = false;
  }

  function startWatch() {
    if (watchId != null || !navigator.geolocation) return;
    const el = document.getElementById('gps-warn');
    if (el) el.hidden = true;
    watchId = navigator.geolocation.watchPosition(onFix, onFixError, {
      enableHighAccuracy: true,
      maximumAge: 2000,
      timeout: 20000
    });
  }

  function stopWatch() {
    if (watchId != null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
  }

  /* ── Enregistrement d'une course ──────── */
  function beginCourse() {
    distance = 0;
    recording = true;
    if (trail) trail.setLatLngs(lastFix ? [[lastFix.lat, lastFix.lon]] : []);
    requestWakeLock();
    emit();
  }

  function endCourse() {
    recording = false;
    releaseWakeLock();
    const km = distance / 1000;
    distance = 0;
    emit();
    return km;
  }

  function currentKm() { return distance / 1000; }

  /* ── Écran allumé ─────────────────────── */
  async function requestWakeLock() {
    if (!Store.settings().keepAwake) return;
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* refusé ou non supporté : sans conséquence */ }
  }

  function releaseWakeLock() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && recording) requestWakeLock();
  });

  /* Remonte l'état réel de la carte et du GPS, pour que
     l'écran Réglages puisse le montrer sans deviner. */
  function diagnostic() {
    return {
      leaflet: typeof L !== 'undefined',
      carte: mapState,
      tuilesChargees: tilesOk,
      tuilesEnEchec: tileErrors,
      source: TILE_SOURCES[sourceIndex] ? TILE_SOURCES[sourceIndex].nom : '—',
      gpsSuivi: watchId != null,
      dernierPoint: lastFix ? { precision: Math.round(lastFix.acc) + ' m',
                                a: new Date(lastFix.t).toLocaleTimeString('fr-FR') } : null,
      enregistrement: recording,
      distanceCourante: (distance / 1000).toFixed(2) + ' km'
    };
  }

  return {
    initMap, recenter, invalidate, diagnostic,
    startWatch, stopWatch,
    beginCourse, endCourse, currentKm,
    on,
    hasFix: () => !!lastFix
  };

})();


/* ═══════════════════════════════════════════
   admin.js — écran Statut

   Toutes les valeurs affichées ici viennent de
   Rules, jamais du code. Changer la loi = changer
   le fichier de réglementation.
   ═══════════════════════════════════════════ */

const Admin = (() => {

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  const DAY = 86400000;

  function frDate(d) {
    return new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function frShort(d) {
    return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
  }
  function lastDay(y, m) { return new Date(y, m + 1, 0); }

  /* ── Échéancier ───────────────────────── */

  /* Construit la suite des échéances à partir de la date de
     début d'activité. La première est décalée du délai légal
     et cumule toutes les périodes déjà écoulées. */
  function schedule(startISO, periodicite, horizonMonths = 24) {
    const R = Rules.all();
    const start = new Date(startISO + 'T00:00:00');
    if (isNaN(start)) return [];

    const openAfter = new Date(start.getTime() + (R.declaration.premiereDeclarationJours || 90) * DAY);
    const out = [];

    if (periodicite === 'mensuelle') {
      const cur = new Date(start.getFullYear(), start.getMonth(), 1);
      for (let i = 0; i < horizonMonths; i++) {
        const y = cur.getFullYear(), m = cur.getMonth();
        out.push({
          pStart: new Date(y, m, 1),
          pEnd: new Date(y, m + 1, 0, 23, 59, 59),
          due: lastDay(y, m + 1),
          label: new Date(y, m, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })
        });
        cur.setMonth(m + 1);
      }
    } else {
      const dues = R.declaration.echeancesTrimestrielles || [];
      const y0 = start.getFullYear();
      for (let y = y0; y <= y0 + Math.ceil(horizonMonths / 12); y++) {
        for (let q = 0; q < 4; q++) {
          const spec = dues[q] || {};
          const [dm, dd] = String(spec.limite || '').split('-').map(Number);
          // Le 4e trimestre se déclare en janvier de l'année suivante.
          const dueYear = q === 3 ? y + 1 : y;
          if (!dm || !dd) continue;
          out.push({
            pStart: new Date(y, q * 3, 1),
            pEnd: new Date(y, q * 3 + 3, 0, 23, 59, 59),
            due: new Date(dueYear, dm - 1, dd),
            label: spec.periode ? `${spec.periode} ${y}` : `T${q + 1} ${y}`
          });
        }
      }
      out.sort((a, b) => a.due - b.due);
    }

    // On écarte les périodes antérieures au début d'activité,
    // puis celles dont l'échéance tombe avant l'ouverture du service.
    const kept = out.filter(e => e.pEnd >= start && e.due >= openAfter);
    if (kept.length) {
      kept[0].pStart = start;
      kept[0].first = true;
      kept[0].label = 'Première déclaration';
    }
    return kept;
  }

  function caBetween(from, to) {
    return Store.courses()
      .filter(c => c.start >= from.getTime() && c.start <= to.getTime())
      .reduce((s, c) => s + (c.amount || 0) + (c.tip || 0), 0);
  }

  /* ── Plafonds ─────────────────────────── */
  function ceilings() {
    const s = Store.settings();
    const R = Rules.all();
    const reg = Rules.regime(s.regimeId);
    const now = new Date();
    const y = now.getFullYear();

    const yearStart = new Date(y, 0, 1);
    const yearEnd = new Date(y, 11, 31, 23, 59, 59);
    const ca = caBetween(yearStart, yearEnd);

    let plafond = reg.plafondCA;
    let prorata = false;
    if (s.dateDebut && R.plafonds && R.plafonds.prorataPremiereAnnee) {
      const d = new Date(s.dateDebut + 'T00:00:00');
      if (!isNaN(d) && d.getFullYear() === y) {
        const days = Math.round((yearEnd - d) / DAY) + 1;
        plafond = Math.round(reg.plafondCA * days / 365);
        prorata = true;
      }
    }
    return { ca, plafond, prorata, tvaBase: reg.tvaBase, tvaMajore: reg.tvaMajore, year: y, regime: reg };
  }

  function gauge(value, max, tone) {
    const pct = Math.min(100, max > 0 ? (value / max) * 100 : 0);
    return `<div class="gauge"><div class="gauge__fill ${tone}" style="width:${pct.toFixed(1)}%"></div></div>`;
  }

  /* ── Registre des recettes ────────────── */
  function registreCSV() {
    const rows = [['Date', 'Reference', 'Origine', 'Montant TTC', 'Dont pourboire', 'Mode encaissement']];
    Store.courses().slice().sort((a, b) => a.start - b.start).forEach((c, i) => {
      rows.push([
        new Date(c.start).toLocaleDateString('fr-FR'),
        'C' + String(i + 1).padStart(5, '0'),
        (c.platform || '').replace(/;/g, ' '),
        ((c.amount || 0) + (c.tip || 0)).toFixed(2).replace('.', ','),
        (c.tip || 0).toFixed(2).replace('.', ','),
        'Virement plateforme'
      ]);
    });
    return '\uFEFF' + rows.map(r => r.join(';')).join('\r\n');
  }

  function download(name, content, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* ── Rendu ────────────────────────────── */
  function render() {
    const s = Store.settings();
    const R = Rules.all();
    const m = Rules.meta();
    const box = $('admin-body');
    const done = Store.checklist();

    const staleWarn = Rules.isStale()
      ? `<div class="banner banner--warn">
           <b>Barème à vérifier.</b> ${m.verifiedOn ? `Il date du ${frDate(m.verifiedOn)}.` : 'Sa date de vérification est inconnue.'}
           Les taux du régime micro sont révisés chaque janvier. Mets le fichier à jour depuis les réglages.
         </div>` : '';

    /* — Bloc identité de l'activité — */
    const regOpts = Rules.regimes().map(r =>
      `<option value="${esc(r.id)}"${s.regimeId === r.id ? ' selected' : ''}>${esc(r.label)}</option>`).join('');

    const effRate = Rules.effectiveCotisation(s.regimeId, s.acreActive);
    const reg = Rules.regime(s.regimeId);

    const identite = `
      <div class="card">
        <p class="card__h">Ton activité</p>
        <label class="field"><span>Date de début d'activité</span>
          <input type="date" id="adm-date" value="${esc(s.dateDebut || '')}"></label>
        <label class="field"><span>Régime</span><select id="adm-regime">${regOpts}</select></label>
        ${reg.aide ? `<p class="hint" style="margin:-6px 0 12px">${esc(reg.aide)}</p>` : ''}
        <label class="field"><span>Périodicité de déclaration</span>
          <select id="adm-period">
            <option value="mensuelle"${s.periodicite === 'mensuelle' ? ' selected' : ''}>Mensuelle</option>
            <option value="trimestrielle"${s.periodicite === 'trimestrielle' ? ' selected' : ''}>Trimestrielle</option>
          </select></label>
        <div class="switchrow">
          <div><div class="switchrow__t">ACRE en cours</div>
            <div class="switchrow__s">Exonération de ${R.acre.exonerationPct} % pendant ${R.acre.dureeMois} mois.</div></div>
          <button class="switch${s.acreActive ? ' on' : ''}" id="adm-acre" aria-label="ACRE"></button>
        </div>
        <div class="row"><div class="row__l"><div class="row__t">Taux de cotisations appliqué</div>
          <div class="row__s">${esc(reg.label)}${s.acreActive ? ' avec ACRE' : ''}</div></div>
          <div class="row__r" style="color:var(--sodium)">${Calc.eur(effRate, 1)} %</div></div>
      </div>`;

    /* — Pas encore de date : on met le parcours en avant — */
    if (!s.dateDebut) {
      box.innerHTML = staleWarn + `
        <div class="banner">
          <b>On commence par le commencement.</b> Renseigne ta date de début d'activité
          une fois immatriculé : l'application construira alors ton échéancier toute seule.
        </div>` + identite + parcoursHTML(R, done) + fichesHTML(R) + sourceHTML(m);
      bind();
      return;
    }

    /* — Échéancier — */
    const sched = schedule(s.dateDebut, s.periodicite || 'trimestrielle');
    const now = Date.now();
    const next = sched.find(e => e.due.getTime() >= now - DAY);
    const late = sched.filter(e => e.due.getTime() < now - DAY).slice(-3);

    let echHTML = '';
    if (next) {
      const ca = caBetween(next.pStart, next.pEnd);
      const days = Math.ceil((next.due.getTime() - now) / DAY);
      const cot = ca * effRate / 100;
      const urgent = days <= 7;

      echHTML = `
        <div class="card ${urgent ? 'card--urgent' : ''}">
          <p class="card__h">Prochaine déclaration</p>
          <div class="deadline">
            <div>
              <div class="deadline__d">${frDate(next.due)}</div>
              <div class="deadline__s">${next.first ? 'Première déclaration' : esc(next.label)} · ${frShort(next.pStart)} au ${frShort(next.pEnd)}</div>
            </div>
            <span class="pill ${urgent ? 'pill--warn' : ''}">${days <= 0 ? "aujourd'hui" : 'dans ' + days + ' j'}</span>
          </div>

          <div class="copybox">
            <div class="copybox__k">Montant à saisir sur l'URSSAF</div>
            <div class="copybox__v" id="ca-value">${Math.round(ca)} €</div>
            <button class="btn btn--ghost" id="btn-copy-ca">Copier le montant</button>
          </div>

          <div class="row"><div class="row__l"><div class="row__t">Cotisations estimées</div>
            <div class="row__s">${Calc.eur(effRate, 1)} % du chiffre d'affaires</div></div>
            <div class="row__r">${Calc.eur(cot)} €</div></div>
          <div class="row"><div class="row__l"><div class="row__t">Courses sur la période</div></div>
            <div class="row__r">${Store.courses().filter(c => c.start >= next.pStart.getTime() && c.start <= next.pEnd.getTime()).length}</div></div>

          <p class="hint">Le montant est arrondi à l'euro, comme le demande le formulaire. ${R.declaration.obligatoireSiZero ? 'La déclaration reste obligatoire même à zéro : une absence coûte ' + Calc.eur(R.declaration.penaliteRetard) + ' € de pénalité.' : ''}</p>
          <a class="btn btn--go" href="${esc(R.declaration.lien || '#')}" style="text-align:center;text-decoration:none;display:block;margin-top:10px">Ouvrir mon espace URSSAF</a>
        </div>`;
    }

    if (late.length) {
      echHTML += `<div class="card">
        <p class="card__h">Échéances passées</p>
        ${late.map(e => {
          const ca = caBetween(e.pStart, e.pEnd);
          return `<div class="row"><div class="row__l"><div class="row__t">${esc(e.label)}</div>
            <div class="row__s">échéance du ${frShort(e.due)}</div></div>
            <div class="row__r">${Math.round(ca)} €</div></div>`;
        }).join('')}
        <p class="hint">Montants recalculés depuis tes courses. Ils servent de contrôle : compare-les à ce que tu as réellement déclaré.</p>
      </div>`;
    }

    /* — Plafonds — */
    const c = ceilings();
    const pctPlafond = c.plafond > 0 ? (c.ca / c.plafond) * 100 : 0;
    const pctTva = c.tvaBase > 0 ? (c.ca / c.tvaBase) * 100 : 0;

    const plafHTML = `
      <div class="card">
        <p class="card__h">Où tu en es sur ${c.year}</p>

        <div class="meter">
          <div class="meter__top"><span>Plafond du régime micro</span><b>${Math.round(c.ca).toLocaleString('fr-FR')} / ${c.plafond.toLocaleString('fr-FR')} €</b></div>
          ${gauge(c.ca, c.plafond, pctPlafond > 90 ? 'bad' : pctPlafond > 70 ? 'warn' : 'ok')}
          <div class="meter__s">${c.prorata ? 'Proratisé sur ta première année d\'activité.' : ''} ${R.plafonds.sortieApresAnnees ? `Il faut ${R.plafonds.sortieApresAnnees} années consécutives au-dessus pour sortir du régime.` : ''}</div>
        </div>

        <div class="meter">
          <div class="meter__top"><span>Seuil de franchise de TVA</span><b>${Math.round(c.ca).toLocaleString('fr-FR')} / ${c.tvaBase.toLocaleString('fr-FR')} €</b></div>
          ${gauge(c.ca, c.tvaBase, pctTva > 90 ? 'bad' : pctTva > 70 ? 'warn' : 'ok')}
          <div class="meter__s">Au-delà de ${c.tvaMajore.toLocaleString('fr-FR')} € la TVA s'applique dès le jour du dépassement.</div>
        </div>
      </div>`;

    /* — Registre — */
    const regHTML = `
      <div class="card">
        <p class="card__h">Registre des recettes</p>
        <p class="hint" style="margin:0 0 12px">La seule comptabilité exigée en micro-entreprise : la liste chronologique de tes encaissements. L'application la tient à partir de tes courses. Exporte-la chaque trimestre et garde les fichiers six ans.</p>
        <div class="row"><div class="row__l"><div class="row__t">Lignes enregistrées</div></div>
          <div class="row__r">${Store.courses().length}</div></div>
        <button class="btn btn--ghost" id="btn-registre" style="margin-top:12px">Exporter le registre (CSV)</button>
      </div>`;

    box.innerHTML = staleWarn + echHTML + plafHTML + identite
      + parcoursHTML(R, done) + obligationsHTML(R) + regHTML + fichesHTML(R) + sourceHTML(m);
    bind();
  }

  /* — Parcours de démarrage — */
  function parcoursHTML(R, done) {
    if (!R.parcours.length) return '';
    const s = Store.settings();
    const concernees = R.parcours.filter(p => !done[p.id] || done[p.id].s !== 'na');
    const total = concernees.length;
    const nb = concernees.filter(p => done[p.id] && done[p.id].s === 'fait').length;

    return `<div class="card">
      <p class="card__h">Démarches de création — ${nb} sur ${total}</p>
      ${R.parcours.map(p => {
        const etat = done[p.id] ? done[p.id].s : null;
        const ok = etat === 'fait';
        const na = etat === 'na';
        let deadline = '';
        if (p.delaiJours && s.dateDebut && !ok && !na) {
          const d = new Date(new Date(s.dateDebut + 'T00:00:00').getTime() + p.delaiJours * 86400000);
          const left = Math.ceil((d - Date.now()) / 86400000);
          deadline = left >= 0
            ? `<span class="pill ${left <= 15 ? 'pill--warn' : ''}">${left} j restants</span>`
            : `<span class="pill pill--bad">délai dépassé</span>`;
        }
        return `<div class="step${ok ? ' is-done' : ''}${na ? ' is-na' : ''}" data-step="${esc(p.id)}">
          <div class="step__h">
            <button class="check${ok ? ' on' : ''}${na ? ' na' : ''}" data-check="${esc(p.id)}" aria-label="Marquer comme fait"></button>
            <div class="step__t">
              <div class="step__title">${esc(p.titre)}</div>
              <div class="step__when">${p.critique ? '<span class="tag">à ne pas rater</span>' : ''}${esc(p.quand)}</div>
            </div>
            ${deadline}
          </div>
          <div class="step__body">
            <p class="step__why">${esc(p.pourquoi)}</p>
            ${p.comment && p.comment.length ? `<ol class="step__list">${p.comment.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
            ${p.aPreparer && p.aPreparer.length ? `<p class="step__prep"><b>À préparer :</b> ${p.aPreparer.map(esc).join(', ')}</p>` : ''}
            ${p.cout ? `<p class="step__prep"><b>Coût :</b> ${esc(p.cout)}</p>` : ''}
            ${p.lien ? `<a class="btn btn--ghost" href="${esc(p.lien)}" style="text-align:center;text-decoration:none;display:block;margin-top:10px">Ouvrir le site officiel</a>` : ''}
            <button class="step__na" data-na="${esc(p.id)}">${na ? 'Finalement, cette étape me concerne' : 'Cette étape ne me concerne pas'}</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  function obligationsHTML(R) {
    if (!R.obligations.length) return '';
    return `<div class="card">
      <p class="card__h">Ce qui revient chaque année</p>
      ${R.obligations.map(o => `<div class="row">
        <div class="row__l"><div class="row__t">${esc(o.titre)}</div>
        <div class="row__s">${esc(o.frequence)} — ${esc(o.description)}</div></div>
      </div>`).join('')}
    </div>`;
  }

  function fichesHTML(R) {
    if (!R.fiches.length) return '';
    return `<div class="card">
      <p class="card__h">Le vocabulaire, en clair</p>
      ${R.fiches.map(f => `<details class="fiche"><summary>${esc(f.terme)}</summary><p>${esc(f.texte)}</p></details>`).join('')}
    </div>`;
  }

  function sourceHTML(m) {
    return `<p class="hint" style="text-align:center;padding:6px 0 24px">
      Barème « ${esc(m.label)} » version ${esc(m.version)}${m.verifiedOn ? `, vérifié le ${frDate(m.verifiedOn)}` : ''}.<br>
      Source : ${esc(m.origin)}. Ces informations sont un repère, pas un conseil juridique ou comptable.
    </p>`;
  }

  /* ── Interactions ─────────────────────── */
  function bind() {
    const set = (id, key, after) => {
      const el = $(id);
      if (el) el.addEventListener('change', () => {
        Store.setSetting(key, el.value);
        if (after) after();
        render();
        App.toast('Enregistré');
      });
    };

    set('adm-date', 'dateDebut');
    set('adm-period', 'periodicite');
    set('adm-regime', 'regimeId', syncRate);

    const acre = $('adm-acre');
    if (acre) acre.addEventListener('click', () => {
      Store.setSetting('acreActive', !Store.settings().acreActive);
      syncRate();
      render();
    });

    document.querySelectorAll('[data-check]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        Store.toggleCheck(b.dataset.check);
        render();
      }));

    document.querySelectorAll('.step__h').forEach(h =>
      h.addEventListener('click', () => h.parentElement.classList.toggle('open')));

    document.querySelectorAll('[data-na]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        const id = b.dataset.na;
        Store.setStep(id, Store.stepState(id) === 'na' ? null : 'na');
        render();
      }));

    const copy = $('btn-copy-ca');
    if (copy) copy.addEventListener('click', () => {
      const v = $('ca-value').textContent.replace(/[^\d]/g, '');
      navigator.clipboard?.writeText(v)
        .then(() => App.toast('Montant copié : ' + v + ' €'))
        .catch(() => App.toast('Montant à recopier : ' + v + ' €'));
    });

    const reg = $('btn-registre');
    if (reg) reg.addEventListener('click', () => {
      if (!Store.courses().length) { App.toast('Aucune course à exporter'); return; }
      download(`registre-recettes-${new Date().toISOString().slice(0, 10)}.csv`,
        registreCSV(), 'text/csv;charset=utf-8');
      App.toast('Registre exporté');
    });
  }

  /* Le taux de cotisation appliqué aux calculs de l'app
     découle du régime et de l'ACRE : on le recalcule ici. */
  function syncRate() {
    const s = Store.settings();
    Store.setSetting('cotisationRate', Rules.effectiveCotisation(s.regimeId, s.acreActive));
  }

  return { render, schedule, ceilings, registreCSV, syncRate };

})();


/* ═══════════════════════════════════════════
   screens.js — rendu des écrans secondaires
   ═══════════════════════════════════════════ */

const Screens = (() => {

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  function empty(title, sub) {
    return `<div class="empty"><div class="empty__t">${title}</div><div class="empty__s">${sub}</div></div>`;
  }

  /* ══ HISTORIQUE ═══════════════════════ */
  function history() {
    const s = Store.settings();
    const sessions = Store.sessions().slice().sort((a, b) => b.start - a.start);
    const box = $('history-list');

    if (!sessions.length) {
      box.innerHTML = empty('Rien pour l\'instant',
        'Tes shifts apparaîtront ici dès le premier terminé.');
      return;
    }

    box.innerHTML = sessions.map(sess => {
      const list = Store.coursesOf(sess.id);
      const dur = (sess.end || Date.now()) - sess.start;
      const t = Calc.summarize(list, s, dur);
      const open = sess.end == null ? ' open' : '';

      const rows = list.length ? list.map(c => {
        const r = Calc.courseNet(c, s);
        return `<div class="row row--tap" data-course="${c.id}">
          <div class="row__l">
            <div class="row__t">${Calc.clock(c.start)} · ${esc(c.platform || '')}</div>
            <div class="row__s">${Calc.km(c.km)} km${r.perKm ? ' · ' + Calc.eur(r.perKm) + ' €/km' : ''}${c.tip ? ' · pourboire ' + Calc.eur(c.tip) + ' €' : ''}</div>
          </div>
          <div class="row__r">${Calc.eur(r.gross)} €</div>
        </div>`;
      }).join('') : '<div class="row"><div class="row__s">Aucune course sur ce shift.</div></div>';

      return `<div class="sess${open}" data-sess="${sess.id}">
        <div class="sess__h">
          <div>
            <div class="sess__d">${Calc.dayLabel(sess.start)}${sess.end == null ? ' · en cours' : ''}</div>
            <div class="sess__m">${Calc.clock(sess.start)}${sess.end ? '–' + Calc.clock(sess.end) : ''} · ${Calc.hoursLabel(dur)} · ${t.n} course${t.n > 1 ? 's' : ''} · ${Calc.km(t.km)} km</div>
          </div>
          <div class="sess__v">${Calc.eur(t.net)} €</div>
        </div>
        <div class="sess__body">
          ${rows}
          <div class="row">
            <div class="row__l"><div class="row__s">Brut ${Calc.eur(t.gross)} € · cotisations −${Calc.eur(t.social)} € · véhicule −${Calc.eur(t.vehicle)} €</div></div>
          </div>
        </div>
      </div>`;
    }).join('');

    box.querySelectorAll('.sess__h').forEach(h => {
      h.addEventListener('click', () => h.parentElement.classList.toggle('open'));
    });
    box.querySelectorAll('[data-course]').forEach(r => {
      r.addEventListener('click', () => App.editCourse(r.dataset.course));
    });
  }

  /* ══ STATS ════════════════════════════ */
  let range = 7;

  function stats() {
    const s = Store.settings();
    const all = Store.courses();
    const list = Calc.sinceDays(all, range);
    const box = $('stats-body');

    if (!all.length) {
      box.innerHTML = empty('Pas encore de données',
        'Enregistre quelques courses et cette page te dira où est l\'argent.');
      return;
    }

    // Durée travaillée sur la période, pour un €/h honnête
    const cut = range >= 9999 ? 0 : Date.now() - range * 86400000;
    const sess = Store.sessions().filter(x => x.start >= cut);
    const worked = Calc.workedMs(sess);
    const t = Calc.summarize(list, s, worked);

    const hours = Calc.byHour(list, s);
    const maxHour = Math.max(...hours.map(h => h.net), 1);
    const bestHour = hours.indexOf(hours.reduce((a, b) => b.net > a.net ? b : a, hours[0]));

    const days = Calc.byWeekday(list, s);
    const maxDay = Math.max(...days.map(d => d.net), 1);

    // On n'affiche que les heures où il s'est passé quelque chose
    const active = hours.map((h, i) => ({ ...h, i })).filter(h => h.n > 0);
    const from = active.length ? Math.max(0, active[0].i - 1) : 8;
    const to = active.length ? Math.min(23, active[active.length - 1].i + 1) : 23;
    const slice = hours.slice(from, to + 1);

    box.innerHTML = goalCard() + `
      <div class="kpis">
        <div class="kpi"><div class="kpi__k">Net encaissé</div><div class="kpi__v pos">${Calc.eur(t.net)} €</div><div class="kpi__s">sur ${Calc.eur(t.gross)} € bruts</div></div>
        <div class="kpi"><div class="kpi__k">Net par heure</div><div class="kpi__v ${t.netPerHour != null && t.netPerHour >= s.hourlyGoal ? 'pos' : 'acc'}">${t.netPerHour != null ? Calc.eur(t.netPerHour) + ' €' : '—'}</div><div class="kpi__s">objectif ${Calc.eur(s.hourlyGoal, 0)} €</div></div>
        <div class="kpi"><div class="kpi__k">Courses</div><div class="kpi__v">${t.n}</div><div class="kpi__s">${t.avg ? Calc.eur(t.avg) + ' € en moyenne' : '—'}</div></div>
        <div class="kpi"><div class="kpi__k">Distance</div><div class="kpi__v">${Math.round(t.km)} km</div><div class="kpi__s">${t.perKm ? Calc.eur(t.perKm) + ' €/km' : '—'}</div></div>
      </div>

      <div class="card">
        <p class="card__h">Ce que rapporte chaque heure</p>
        <div class="bars">
          ${slice.map(h => {
            const idx = hours.indexOf(h);
            const pct = Math.max(3, (h.net / maxHour) * 100);
            return `<div class="bar ${idx === bestHour && h.net > 0 ? 'best' : ''}" style="height:${pct}%" title="${idx}h — ${Calc.eur(h.net)} €"></div>`;
          }).join('')}
        </div>
        <div class="barlabels"><span>${from}h</span><span>${Math.round((from + to) / 2)}h</span><span>${to}h</span></div>

  /* Le bloc d'objectif : où j'en suis, et combien aujourd'hui. */
  function goalCard() {
    const s = Store.settings();
    const g = Calc.goalStatus(Store.courses(), s);
    if (!g) return '';

    const unite = g.basis === 'net' ? 'net' : 'brut';
    const nb = n => Math.round(n).toLocaleString('fr-FR');

    if (g.reached) {
      return `<div class="card goal">
        <p class="card__h">Objectif atteint</p>
        <div class="goal__big" style="color:var(--mint)">${nb(g.done)} €</div>
        <div class="goal__sub">Tu visais ${nb(g.amount)} € ${unite}. C'est fait.</div>
        <div class="gauge" style="margin-top:10px"><div class="gauge__fill ok" style="width:100%"></div></div>
      </div>`;
    }

    if (g.finished) {
      return `<div class="card goal">
        <p class="card__h">Période terminée</p>
        <div class="goal__big">${nb(g.done)} €</div>
        <div class="goal__sub">sur ${nb(g.amount)} € visés — il manquait ${nb(g.remain)} €</div>
        <div class="gauge" style="margin-top:10px"><div class="gauge__fill warn" style="width:${g.pct.toFixed(1)}%"></div></div>
        <p class="hint">Fixe une nouvelle période dans les réglages pour repartir.</p>
      </div>`;
    }

    const avance = g.ahead >= 0;
    const ecart = nb(Math.abs(g.ahead));

    return `<div class="card goal">
      <p class="card__h">Objectif — ${nb(g.amount)} € ${unite}</p>

      <div class="goal__row">
        <div>
          <div class="goal__big">${nb(g.done)} €</div>
          <div class="goal__sub">${g.pct.toFixed(1)} % · reste ${nb(g.remain)} €</div>
        </div>
        <span class="pill ${avance ? 'pill--ok' : 'pill--warn'}">${avance ? '+' : '−'}${ecart} €</span>
      </div>

      <div class="gauge"><div class="gauge__fill ${avance ? 'ok' : 'warn'}" style="width:${g.pct.toFixed(1)}%"></div></div>
      <div class="goal__scale"><span>${g.start.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</span><span>${g.end.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: '2-digit' })}</span></div>

      <div class="goal__target">
        <div class="goal__tk">À faire par jour travaillé</div>
        <div class="goal__tv">${g.perDay != null ? Calc.eur(g.perDay) + ' €' : '—'}</div>
        <div class="goal__ts">${g.daysLeft} jour${g.daysLeft > 1 ? 's' : ''} travaillable${g.daysLeft > 1 ? 's' : ''} d'ici l'échéance</div>
      </div>

      ${g.isWorkDay ? `<div class="goal__today">
        <div class="goal__trow"><span>Aujourd'hui</span><b>${Calc.eur(g.todayDone)} / ${Calc.eur(g.todayTarget)} €</b></div>
        <div class="gauge"><div class="gauge__fill ${g.todayLeft === 0 ? 'ok' : 'warn'}" style="width:${g.todayPct.toFixed(1)}%"></div></div>
        <div class="goal__ts">${g.todayLeft === 0 ? 'Objectif du jour atteint.' : 'Encore ' + Calc.eur(g.todayLeft) + ' € pour tenir le rythme.'}</div>
      </div>` : `<p class="hint">Aujourd'hui n'est pas un jour travaillé dans tes réglages. Rien n'est attendu, et les autres jours en tiennent déjà compte.</p>`}

      ${g.nbWorked ? `<div class="row" style="margin-top:6px"><div class="row__l">
        <div class="row__t">Au rythme actuel</div>
        <div class="row__s">${Calc.eur(g.avgPerWorkedDay)} € par jour travaillé, sur ${g.nbWorked} jour${g.nbWorked > 1 ? 's' : ''}${g.etaDate ? ' · objectif atteint le ' + g.etaDate.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : ''}</div></div>
        <div class="row__r" style="color:${g.atteignable === false ? 'var(--rose)' : 'var(--mint)'}">${nb(g.projection)} €</div></div>` : ''}

      ${g.atteignable === false ? `<p class="hint" style="color:#F0D9A8">À ce rythme tu finirais à ${nb(g.projection)} €, soit ${nb(g.amount - g.projection)} € de moins. Trois leviers : monter à ${Calc.eur(g.perDay)} € par jour, ajouter des jours travaillables, ou revoir le montant.</p>` : ''}
    </div>`;
  }

  function bindSettings() {
    const num = (id, key) => {
      const el = $(id);
      if (el) el.addEventListener('change', () => {
        const v = parseFloat(el.value.replace(',', '.'));
        if (!isNaN(v) && v >= 0) { Store.setSetting(key, v); App.toast('Enregistré'); }
        else el.value = Store.settings()[key];
      });
    };

    num('set-cost', 'costPerKm');
    num('set-speed', 'avgSpeed');
    num('set-threshold', 'thresholdPerKm');
    num('set-minfare', 'minFare');
    num('set-hgoal', 'hourlyGoal');
    num('set-goal-amount', 'goalAmount');
    num('set-dgoal', 'dailyGoal');
    num('set-cotis', 'cotisationRate');
    num('set-prov', 'provisionRate');

    $('set-vehicle').addEventListener('change', e => {
      const v = Store.VEHICLES[e.target.value];
      Store.setSetting('vehicle', e.target.value);
      Store.setSetting('costPerKm', v.cost);
      Store.setSetting('avgSpeed', v.speed);
      settings();
      App.toast('Valeurs du véhicule appliquées');
    });

    const toggle = (id, key) => {
      const el = $(id);
      if (el) el.addEventListener('click', () => {
        const v = !Store.settings()[key];
        Store.setSetting(key, v);
        el.classList.toggle('on', v);
      });
    };
    toggle('set-return', 'countReturn');
    toggle('set-auto', 'autoDistance');
    toggle('set-awake', 'keepAwake');

    // — Grand objectif —
    const gOn = $('set-goal-on');
    if (gOn) gOn.addEventListener('click', () => {
      const v = !Store.settings().goalEnabled;
      Store.setSetting('goalEnabled', v);
      gOn.classList.toggle('on', v);
      $('goal-fields').hidden = !v;
    });

    const gKeys = { 'set-goal-basis': 'goalBasis', 'set-goal-start': 'goalStart', 'set-goal-end': 'goalEnd' };
    Object.keys(gKeys).forEach(id => {
      const el = $(id);
      if (!el) return;
      el.addEventListener('change', () => {
        Store.setSetting(gKeys[id], el.value);
        goalPreview();
        App.toast('Enregistré');
      });
    });

    const dp = $('goal-days');
    if (dp) dp.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const d = Number(b.dataset.day);
      const arr = (Store.settings().goalDays || []).slice();
      const i = arr.indexOf(d);
      if (i === -1) arr.push(d); else arr.splice(i, 1);
      Store.setSetting('goalDays', arr);
      b.classList.toggle('on', i === -1);
      goalPreview();
    });
    goalPreview();

    $('btn-add-platform').addEventListener('click', () => {
      const el = $('new-platform');
      const v = el.value.trim();
      if (!v) return;
      const arr = Store.settings().platforms.slice();
      if (!arr.includes(v)) arr.push(v);
      Store.setSetting('platforms', arr);
      el.value = '';
      renderPlatforms();
      App.refreshPlatformSelect();
    });

    /* Purge le cache hors ligne puis recharge : le seul moyen sûr
       de sortir d'une version restée coincée en mémoire. Les
       courses et réglages, eux, ne sont pas touchés. */
    $('btn-update').addEventListener('click', async () => {
      App.toast('Nettoyage…');
      try {
        if ('serviceWorker' in navigator) {
          const rs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(rs.map(r => r.unregister()));
        }
        if (window.caches) {
          const ks = await caches.keys();
          await Promise.all(ks.map(k => caches.delete(k)));
        }
      } catch (e) { /* sans conséquence : on recharge quand même */ }
      location.href = location.pathname + '?maj=' + Date.now();
    });

    $('btn-diag-refresh').addEventListener('click', () => { renderDiag(); App.toast('Diagnostic rafraîchi'); });

    $('btn-diag-copy').addEventListener('click', () => {
      const t = diagText();
      navigator.clipboard?.writeText(t)
        .then(() => App.toast('Diagnostic copié'))
        .catch(() => App.toast('Copie impossible — sélectionne le texte à la main'));
    });

    $('btn-rules-import').addEventListener('click', () => $('file-rules').click());

    $('file-rules').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          Rules.apply(r.result);
          Admin.syncRate();
          App.toast('Barème mis à jour');
          settings();
        } catch (err) {
          alert('Barème refusé.\n\n' + err.message);
        }
      };
      r.readAsText(f);
      e.target.value = '';
    });

    $('btn-rules-model').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(Rules.all(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'reglementation.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      App.toast('Barème téléchargé — modifie-le puis réimporte-le');
    });

    const rr = $('btn-rules-reset');
    if (rr) rr.addEventListener('click', () => {
      Rules.reset();
      App.toast('Barème du dépôt restauré');
      setTimeout(() => location.reload(), 700);
    });

    $('btn-export').addEventListener('click', () => {
      const blob = new Blob([Store.exportJSON()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tournee-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      App.toast('Sauvegarde téléchargée');
    });

    $('btn-import').addEventListener('click', () => $('file-import').click());
    $('file-import').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          Store.importJSON(r.result);
          App.toast('Sauvegarde restaurée');
          setTimeout(() => location.reload(), 700);
        } catch (err) {
          App.toast('Fichier illisible');
        }
      };
      r.readAsText(f);
    });

    $('btn-wipe').addEventListener('click', () => {
      if (!confirm('Effacer toutes tes courses, shifts et réglages ? Cette action est définitive.')) return;
      Store.wipe();
      location.reload();
    });
  }

  return { history, stats, settings, bindStatsRange, renderDiag };

})();


/* ═══════════════════════════════════════════
   app.js — contrôleur principal
   ═══════════════════════════════════════════ */

const App = (() => {

  /* Numéro de version, affiché dans les réglages et dans le
     diagnostic. Il permet de savoir en un coup d'oeil quelle
     version tourne réellement, sans avoir à comparer des fichiers. */
  const VERSION = '7';
  const VERSION_DATE = '1er septembre 2026';

  const $ = id => document.getElementById(id);
  let tab = 'course';
  let editingId = null;
  let ticker = null;

  /* ── Petits utilitaires d'interface ───── */
  let toastTimer = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
  }

  function openModal(id) { $(id).hidden = false; }
  function closeModal(id) { $(id).hidden = true; }

  function numVal(id) {
    const v = parseFloat(String($(id).value).replace(',', '.'));
    return isNaN(v) ? null : v;
  }

  /* ── Navigation ───────────────────────── */
  function go(name) {
    tab = name;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('is-active'));
    $('screen-' + name).classList.add('is-active');
    document.querySelectorAll('#tabbar button').forEach(b =>
      b.classList.toggle('is-on', b.dataset.tab === name));

    if (name === 'course')   Tracker.invalidate();
    if (name === 'admin')    Admin.render();
    if (name === 'history')  Screens.history();
    if (name === 'stats')    Screens.stats();
    if (name === 'settings') Screens.settings();
  }

  /* ── État de l'écran Course ───────────── */
  function state() {
    const a = Store.active();
    if (!a) return 'idle';
    return a.courseId ? 'running' : 'ready';
  }

  function showPane(name) {
    ['idle', 'ready', 'running'].forEach(p =>
      $('pane-' + p).classList.toggle('is-active', p === name));
  }

  function renderCourseScreen() {
    const s = Store.settings();
    const st = state();
    const a = Store.active();

    showPane(st);

    // Pastille d'état
    const dot = $('status-dot'), lab = $('status-label');
    dot.className = 'dot' + (st === 'running' ? ' run' : st === 'ready' ? ' on' : '');
    lab.textContent = st === 'running' ? 'Course en cours' : st === 'ready' ? 'En service' : 'Hors service';

    // Chiffres du jour
    const today = Calc.todayCourses(Store.courses());
    const todaySess = Calc.todaySessions(Store.sessions());
    const worked = Calc.workedMs(todaySess);
    const t = Calc.summarize(today, s, worked);

    const figs = [
      { k: 'Net du jour', v: Calc.eur(t.net) + ' €', c: t.net >= s.dailyGoal ? 'pos' : '' },
      { k: 'Net / heure', v: t.netPerHour != null ? Calc.eur(t.netPerHour) + ' €' : '—',
        c: t.netPerHour != null ? (t.netPerHour >= s.hourlyGoal ? 'pos' : 'neg') : '' },
      { k: 'Courses', v: String(t.n), c: '' },
      { k: 'Km', v: Math.round(t.km) + '', c: '' }
    ];
    const html = figs.map(f =>
      `<div class="fig"><div class="fig__k">${f.k}</div><div class="fig__v ${f.c}">${f.v}</div></div>`).join('');

    $('figures-foot').innerHTML = html;
    $('figures-foot').style.display = st === 'idle' ? 'none' : 'flex';

    renderGoalBar(st);

    // Récapitulatif quand on est hors service
    if (st === 'idle') {
      $('recap-idle').innerHTML = t.n
        ? `<div class="figures figures--foot">${html}</div>`
        : '';
    }

    // Course en cours
    if (st === 'running') {
      const offered = a.offerAmount;
      $('run-amount').textContent = offered != null ? Calc.eur(offered) : '—';
      const chip = $('run-chip');
      if (offered != null && a.offerKm) {
        const j = Calc.judge(offered, a.offerKm, s);
        chip.className = 'verdict-chip ' + (j ? j.level : '');
        chip.textContent = j ? j.word : '';
      } else {
        chip.className = 'verdict-chip';
        chip.textContent = '';
      }
    }

    updateChrono();
  }

  /* Rappel discret de l'objectif du jour, visible pendant le
     travail sans avoir à quitter l'écran de course. */
  function renderGoalBar(st) {
    const bar = $('goalbar');
    const g = Calc.goalStatus(Store.courses(), Store.settings());

    if (!g || g.finished || st === 'idle') { bar.hidden = true; return; }

    if (g.reached) {
      bar.hidden = false;
      bar.innerHTML = '<div class="goalbar__row"><span>Objectif atteint</span>'
        + '<b style="color:var(--mint)">' + Math.round(g.done).toLocaleString('fr-FR') + ' €</b></div>'
        + '<div class="gauge"><div class="gauge__fill ok" style="width:100%"></div></div>';
      return;
    }

    if (!g.isWorkDay) {
      bar.hidden = false;
      bar.innerHTML = '<div class="goalbar__row"><span>Jour de repos prévu</span>'
        + '<b>' + Calc.eur(g.todayDone) + ' €</b></div>';
      return;
    }

    bar.hidden = false;
    bar.innerHTML = '<div class="goalbar__row"><span>Objectif du jour</span><b>'
      + Calc.eur(g.todayDone) + ' / ' + Calc.eur(g.todayTarget) + ' €</b></div>'
      + '<div class="gauge"><div class="gauge__fill ' + (g.todayLeft === 0 ? 'ok' : 'warn')
      + '" style="width:' + g.todayPct.toFixed(1) + '%"></div></div>';
  }

  /* Le chrono affiche la course quand il y en a une,
     sinon la durée du shift. */
  function updateChrono() {
    const a = Store.active();
    const sess = Store.activeSession();
    let ms = 0;
    if (a && a.courseStart) ms = Date.now() - a.courseStart;
    else if (sess) ms = Date.now() - sess.start;
    $('chrono').textContent = Calc.hms(ms);

    if (a && a.courseId) {
      const km = Store.settings().autoDistance ? Tracker.currentKm() : 0;
      const sub = $('run-sub');
      if (Store.settings().autoDistance) {
        sub.textContent = Calc.km(km) + ' km parcourus'
          + (a.offerKm ? ` · ${Calc.km(a.offerKm)} km annoncés` : '');
      } else {
        sub.textContent = a.offerKm ? `${Calc.km(a.offerKm)} km annoncés` : 'Distance saisie à la fin';
      }
    }
  }

  /* Le chrono bat à la seconde ; les chiffres du jour ne bougent
     qu'au quart de minute, pour ne pas réécrire le DOM sans cesse. */
  function startTicker() {
    stopTicker();
    let n = 0;
    ticker = setInterval(() => {
      updateChrono();
      n++;
      if (n % 15 === 0 && tab === 'course' && Store.activeSession()) renderCourseScreen();
    }, 1000);
  }
  function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

  /* ── Évaluation d'une offre ───────────── */
  function refreshPlatformSelect() {
    const s = Store.settings();
    const sel = $('offer-platform');
    sel.innerHTML = s.platforms.map(p =>
      `<option value="${p}"${p === s.lastPlatform ? ' selected' : ''}>${p}</option>`).join('')
      || '<option value="">—</option>';
  }

  function renderVerdict() {
    const s = Store.settings();
    const amount = numVal('offer-amount');
    const kmDist = numVal('offer-km');
    const box = $('offer-verdict');
    const word = $('verdict-word');
    const rate = $('verdict-rate');
    const lines = $('verdict-lines');

    const j = Calc.judge(amount, kmDist, s);
    if (!j) {
      box.className = 'verdict';
      word.textContent = '—';
      rate.textContent = '';
      lines.innerHTML = '<div class="vline"><span>Saisis le montant et la distance pour obtenir un verdict.</span></div>';
      return;
    }

    box.className = 'verdict ' + j.level;
    word.textContent = j.word;
    rate.textContent = Calc.eur(j.perKm) + ' €/km';
    lines.innerHTML = `
      <div class="vline"><span>Net estimé</span><b>${Calc.eur(j.net)} €</b></div>
      <div class="vline"><span>Ramené à l'heure</span><b>${Calc.eur(j.perHour)} €/h</b></div>
      <div class="vline"><span>Durée estimée</span><b>${Math.round(j.minutes)} min</b></div>
      <div class="vline"><span>Cotisations et véhicule</span><b>−${Calc.eur(j.social + j.vehicle)} €</b></div>`;
  }

  function beginCourse(offer) {
    Store.startCourse(offer);
    if (Store.settings().autoDistance) Tracker.beginCourse();
    closeModal('modal-offer');
    renderCourseScreen();
  }

  /* ── Clôture d'une course ─────────────── */
  function openCloseModal() {
    const s = Store.settings();
    const a = Store.active();
    const tracked = s.autoDistance ? Tracker.currentKm() : (a.offerKm || 0);

    $('close-amount').value = a.offerAmount != null ? a.offerAmount : '';
    $('close-tip').value = '';
    $('close-km').value = tracked ? tracked.toFixed(2) : (a.offerKm || '');
    $('close-tracked').textContent = s.autoDistance
      ? `${Calc.km(tracked)} km mesurés au GPS${a.offerKm ? `, ${Calc.km(a.offerKm)} km annoncés` : ''}.`
      : 'Saisis la distance parcourue.';

    openModal('modal-close');
    setTimeout(() => $('close-amount').focus(), 220);
  }

  function saveCourse() {
    const amount = numVal('close-amount');
    if (amount == null) { toast('Indique le montant encaissé'); return; }

    const kmVal = numVal('close-km') || 0;
    Store.saveCourse({
      amount,
      tip: numVal('close-tip') || 0,
      km: kmVal,
      platform: Store.active().platform
    });

    Tracker.endCourse();
    closeModal('modal-close');
    renderCourseScreen();
    toast('Course enregistrée');
  }

  /* ── Retouche d'une course ────────────── */
  function editCourse(id) {
    const c = Store.courses().find(x => x.id === id);
    if (!c) return;
    editingId = id;
    $('edit-amount').value = c.amount;
    $('edit-tip').value = c.tip || 0;
    $('edit-km').value = c.km;
    openModal('modal-edit');
  }

  /* ── Démarrage ────────────────────────── */
  function bind() {

    // Onglets
    $('tabbar').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) go(b.dataset.tab);
    });

    // Shift
    $('btn-start-shift').addEventListener('click', () => {
      Store.openSession();
      Tracker.startWatch();
      renderCourseScreen();
      toast('Shift démarré');
    });

    $('btn-end-shift').addEventListener('click', () => {
      const s = Store.settings();
      const sess = Store.activeSession();
      const list = Store.coursesOf(sess.id);
      const t = Calc.summarize(list, s, Date.now() - sess.start);
      Store.closeSession();
      Tracker.stopWatch();
      renderCourseScreen();
      toast(t.n ? `Shift terminé — ${Calc.eur(t.net)} € net` : 'Shift terminé');
    });

    // Offre
    $('btn-open-offer').addEventListener('click', () => {
      refreshPlatformSelect();
      $('offer-amount').value = '';
      $('offer-km').value = '';
      renderVerdict();
      openModal('modal-offer');
      setTimeout(() => $('offer-amount').focus(), 220);
    });

    ['offer-amount', 'offer-km'].forEach(id =>
      $(id).addEventListener('input', renderVerdict));

    $('btn-accept-offer').addEventListener('click', () => {
      beginCourse({
        amount: numVal('offer-amount'),
        km: numVal('offer-km'),
        platform: $('offer-platform').value
      });
    });

    $('btn-skip-offer').addEventListener('click', () => {
      beginCourse({ amount: null, km: null, platform: $('offer-platform').value });
    });

    // Course
    $('btn-deliver').addEventListener('click', openCloseModal);
    $('btn-save-course').addEventListener('click', saveCourse);

    $('btn-cancel-course').addEventListener('click', () => {
      if (!confirm('Annuler cette course ? Elle ne sera pas enregistrée.')) return;
      Store.abortCourse();
      Tracker.endCourse();
      renderCourseScreen();
    });

    // Retouche
    $('btn-update-course').addEventListener('click', () => {
      Store.updateCourse(editingId, {
        amount: numVal('edit-amount') || 0,
        tip: numVal('edit-tip') || 0,
        km: numVal('edit-km') || 0
      });
      closeModal('modal-edit');
      Screens.history();
      toast('Course modifiée');
    });

    $('btn-delete-course').addEventListener('click', () => {
      if (!confirm('Supprimer cette course ?')) return;
      Store.deleteCourse(editingId);
      closeModal('modal-edit');
      Screens.history();
      toast('Course supprimée');
    });

    // Fermetures
    document.querySelectorAll('[data-close]').forEach(b =>
      b.addEventListener('click', () => closeModal(b.dataset.close)));

    document.querySelectorAll('.modal').forEach(m =>
      m.addEventListener('click', e => { if (e.target === m) m.hidden = true; }));

    // Carte
    $('btn-recenter').addEventListener('click', Tracker.recenter);

    Screens.bindStatsRange();

    // Mise à jour de la distance en direct
    Tracker.on(() => { if (state() === 'running') updateChrono(); });
  }

  async function init() {
    // Aucune modale ne doit survivre au démarrage.
    document.querySelectorAll('.modal').forEach(m => { m.hidden = true; });
    $('toast').hidden = true;

    // La réglementation se charge avant tout affichage :
    // sans elle, aucun taux ni aucune échéance n'est fiable.
    await Rules.init();

    // Le taux appliqué découle du régime et de l'ACRE.
    Admin.syncRate();

    bind();
    Tracker.initMap();

    // Si un shift était ouvert, on reprend le suivi là où il s'est arrêté.
    if (Store.active()) {
      Tracker.startWatch();
      // Une course interrompue par une fermeture d'onglet perd sa
      // distance GPS : on la reprend à zéro plutôt que d'inventer.
      if (Store.active().courseId && Store.settings().autoDistance) Tracker.beginCourse();
    }

    renderCourseScreen();
    startTicker();
    go('course');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }

  document.addEventListener('DOMContentLoaded', init);

  return { toast, editCourse, refreshPlatformSelect, go, VERSION, VERSION_DATE };

})();

</script>
