<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Tournée</title>
<meta name="tournee-version" content="7">
<meta name="description" content="Carnet de bord pour livreurs indépendants : suivi des courses, du net réel et des provisions.">
<meta name="theme-color" content="#0A0E15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tournée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ═══════════════════════════════════════════
   Tournée — thème « nuit »
   Palette inspirée de l'éclairage urbain :
   ciel nocturne, ambre sodium, vert signal.
   ═══════════════════════════════════════════ */

:root{
  --ink:#0A0E15;
  --slate:#141A24;
  --slate-2:#1D2530;
  --slate-3:#252F3D;
  --line:#26303D;
  --sodium:#FFB627;
  --sodium-dim:#3A2C10;
  --mint:#3DD68C;
  --mint-dim:#0F3527;
  --rose:#FF5D5D;
  --rose-dim:#3B1A1C;
  --sky:#5AA9FF;
  --text:#E9EDF2;
  --muted:#8A97A6;
  --faint:#5E6B7A;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{height:100%;margin:0;overscroll-behavior:none}

body{
  background:var(--ink);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.num,.chrono{font-family:'Barlow Condensed',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}

#app{height:100%;position:relative;overflow:hidden}

/* ── Écrans ────────────────────────────── */
.screen{position:absolute;inset:0;bottom:calc(62px + var(--safe-b));display:none}
.screen.is-active{display:block}
.screen--scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 18px) 16px 28px}

.title{font-size:26px;font-weight:700;margin:0 0 16px;letter-spacing:-.02em}

/* ── Carte ─────────────────────────────── */
#map{position:absolute;inset:0;bottom:0;background:var(--slate);z-index:0}
.leaflet-container{background:#0D1219!important;font-family:inherit}
.leaflet-control-attribution{background:rgba(10,14,21,.7)!important;color:var(--faint)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--faint)!important}
.leaflet-control-zoom{display:none}

.map-veil{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,14,21,.85) 0,rgba(10,14,21,0) 22%,rgba(10,14,21,0) 45%,rgba(10,14,21,.6) 70%)}

.me-dot{width:16px;height:16px;border-radius:50%;background:var(--sky);border:2.5px solid #0A0E15;box-shadow:0 0 0 6px rgba(90,169,255,.22)}

/* ── Barre du haut ─────────────────────── */
.topbar{position:absolute;top:0;left:0;right:0;z-index:3;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 12px) 16px 10px;gap:12px}

.topbar__status{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;
  background:rgba(20,26,36,.82);backdrop-filter:blur(12px);
  padding:7px 13px 7px 11px;border-radius:99px;border:1px solid var(--line)}

.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none;transition:background .25s}
.dot.on{background:var(--mint);box-shadow:0 0 0 4px rgba(61,214,140,.18)}
.dot.run{background:var(--sodium);box-shadow:0 0 0 4px rgba(255,182,39,.2);animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.topbar__right{display:flex;align-items:center;gap:10px}
.chrono{font-size:20px;font-weight:600;color:var(--text);
  background:rgba(20,26,36,.82);backdrop-filter:blur(12px);
  padding:4px 12px;border-radius:10px;border:1px solid var(--line)}

.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;
  background:rgba(20,26,36,.82);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:12px;color:var(--text);cursor:pointer}
.iconbtn:active{transform:scale(.94)}

.gps-warn{position:absolute;z-index:3;left:16px;right:16px;top:calc(var(--safe-t) + 62px);
  background:var(--rose-dim);border:1px solid #5C2A2C;color:#FFC9C9;
  padding:9px 13px;border-radius:11px;font-size:12.5px;line-height:1.45}

/* ── Feuille du bas ────────────────────── */
.sheet{position:absolute;z-index:4;left:0;right:0;bottom:0;
  background:var(--slate);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);
  padding:10px 16px calc(16px + var(--safe-b));
  box-shadow:0 -18px 40px rgba(0,0,0,.5)}

.sheet__grip{width:36px;height:4px;border-radius:99px;background:var(--slate-3);margin:0 auto 14px}

.pane{display:none}
.pane.is-active{display:block;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.pane__lead{margin:0 0 14px;color:var(--muted);font-size:14px}

/* ── Boutons ───────────────────────────── */
.btn{display:block;width:100%;border:none;border-radius:var(--r);
  font-family:inherit;font-size:16px;font-weight:700;padding:16px;cursor:pointer;
  transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.985);filter:brightness(1.08)}
.btn+.btn{margin-top:9px}

.btn--go{background:var(--sodium);color:#20160A}
.btn--ghost{background:var(--slate-2);color:var(--text);border:1px solid var(--line)}
.btn--quiet{font-size:14.5px;font-weight:600;padding:13px;color:var(--muted)}
.btn--danger{background:var(--rose-dim);color:#FFAFAF;border:1px solid #5C2A2C}

.linkbtn{display:block;width:100%;background:none;border:none;color:var(--faint);
  font-family:inherit;font-size:13.5px;padding:14px 0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ── Chiffres du bandeau ───────────────── */
.figures{display:flex;gap:8px}
.figures--foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.fig{flex:1;min-width:0}
.fig__k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:600;white-space:nowrap}
.fig__v{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:600;line-height:1.15;margin-top:1px;font-variant-numeric:tabular-nums}
.fig__v.pos{color:var(--mint)}
.fig__v.neg{color:var(--rose)}
.fig__v.acc{color:var(--sodium)}

/* ── Course en cours ───────────────────── */
.running{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.running__amount{display:flex;align-items:baseline;gap:4px}
.running__amount .num{font-size:44px;font-weight:600;line-height:1}
.running__amount .unit{font-size:20px;color:var(--muted);font-weight:600}
.running__sub{margin:4px 0 16px;color:var(--muted);font-size:13.5px}

.verdict-chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap;margin-top:5px}
.verdict-chip.go{background:var(--mint-dim);color:var(--mint)}
.verdict-chip.no{background:var(--rose-dim);color:var(--rose)}
.verdict-chip.mid{background:var(--sodium-dim);color:var(--sodium)}

/* ── Onglets ───────────────────────────── */
.tabbar{position:absolute;z-index:6;left:0;right:0;bottom:0;height:calc(62px + var(--safe-b));
  display:flex;background:rgba(10,14,21,.92);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar button{flex:1;background:none;border:none;color:var(--faint);
  font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.tabbar svg{width:21px;height:21px}
.tabbar button.is-on{color:var(--sodium)}

/* ── Cartes ────────────────────────────── */
.card{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px}
.card__h{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin:0 0 11px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.kpi{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.kpi__k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi__v{font-family:'Barlow Condensed',sans-serif;font-size:29px;font-weight:600;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi__v.pos{color:var(--mint)}
.kpi__v.acc{color:var(--sodium)}
.kpi__s{font-size:11.5px;color:var(--faint);margin-top:2px}

/* ── Lignes de données ─────────────────── */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row__l{min-width:0}
.row__t{font-size:14.5px;font-weight:600}
.row__s{font-size:12px;color:var(--faint);margin-top:1px}
.row__r{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.row--tap{cursor:pointer}
.row--tap:active{opacity:.6}

.sess{margin-bottom:11px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--slate)}
.sess__h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;cursor:pointer;background:var(--slate-2)}
.sess__d{font-size:14.5px;font-weight:700;text-transform:capitalize}
.sess__m{font-size:11.5px;color:var(--faint);margin-top:1px}
.sess__v{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:600;color:var(--mint);font-variant-numeric:tabular-nums}
.sess__body{padding:2px 15px;display:none}
.sess.open .sess__body{display:block}

/* ── Barres horaires ───────────────────── */
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;margin:6px 0 8px}
.bar{flex:1;background:var(--slate-3);border-radius:3px 3px 0 0;min-height:3px;position:relative;transition:height .3s}
.bar.best{background:var(--sodium)}
.barlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ── Segments ──────────────────────────── */
.segmented{display:flex;gap:5px;background:var(--slate);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:14px}
.segmented button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;
  font-size:13px;font-weight:600;padding:9px 4px;border-radius:8px;cursor:pointer}
.segmented button.is-on{background:var(--slate-3);color:var(--text)}

/* ── Formulaires ───────────────────────── */
.field{display:block;margin-bottom:13px}
.field>span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.fieldrow{display:flex;gap:10px}
.fieldrow .field{flex:1;min-width:0}

.inputwrap{position:relative;display:flex;align-items:center}
.inputwrap i{position:absolute;right:14px;font-style:normal;color:var(--faint);font-size:14px;font-weight:600;pointer-events:none}

input[type=number],input[type=text],select{
  width:100%;background:var(--slate-2);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600;
  padding:12px 40px 12px 14px;outline:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
input[type=text]{font-family:'Manrope',sans-serif;font-size:15px;font-weight:500;padding-right:14px}
select{font-family:'Manrope',sans-serif;font-size:15px;font-weight:600;padding-right:14px;
  appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238A97A6' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:17px}
input:focus,select:focus{border-color:var(--sodium)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.switchrow:last-child{border-bottom:none}
.switchrow__t{font-size:14.5px;font-weight:600}
.switchrow__s{font-size:12px;color:var(--faint);margin-top:2px;line-height:1.45}
.switch{width:48px;height:28px;flex:none;border-radius:99px;background:var(--slate-3);border:none;position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch.on{background:var(--sodium)}
.switch.on::after{transform:translateX(20px);background:#20160A}

.hint{font-size:12px;color:var(--faint);line-height:1.55;margin:8px 0 0}
.hint strong{color:var(--muted);font-weight:600}

.chiplist{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{background:var(--slate-2);border:1px solid var(--line);border-radius:99px;
  padding:7px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.chip button{background:none;border:none;color:var(--faint);font-size:17px;line-height:1;cursor:pointer;padding:0}

/* ── Modales ───────────────────────────── */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,13,.72);
  backdrop-filter:blur(5px);display:flex;align-items:flex-end;animation:fade .18s ease}
/* Une règle d'auteur qui pose display l'emporte sur l'attribut hidden :
   il faut donc le rétablir explicitement, ici et partout ailleurs. */
[hidden]{display:none!important}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal__card{width:100%;background:var(--slate);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);padding:10px 16px calc(18px + var(--safe-b));
  max-height:92vh;overflow-y:auto;animation:slideup .26s cubic-bezier(.22,1,.36,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.modal__grip{width:36px;height:4px;border-radius:99px;background:var(--slate-3);margin:0 auto 16px}
.modal__card h2{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.modal__sub{font-size:13px;color:var(--muted);margin:0 0 16px}
.modal__card h2+.fieldrow,.modal__card h2+.field{margin-top:16px}
.modal__actions{display:flex;gap:10px;margin-top:6px}
.modal__actions .btn{margin-top:0}
.modal__actions .btn--ghost{flex:0 0 38%}

/* ── Verdict ───────────────────────────── */
.verdict{border-radius:var(--r);padding:14px;margin:4px 0 16px;border:1px solid var(--line);background:var(--slate-2)}
.verdict.go{background:var(--mint-dim);border-color:#1B5C42}
.verdict.no{background:var(--rose-dim);border-color:#5C2A2C}
.verdict.mid{background:var(--sodium-dim);border-color:#5C4715}
.verdict__head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.verdict__word{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.verdict.go .verdict__word{color:var(--mint)}
.verdict.no .verdict__word{color:var(--rose)}
.verdict.mid .verdict__word{color:var(--sodium)}
.verdict__rate{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.verdict__lines{margin-top:9px;display:grid;gap:4px}
.vline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.vline b{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

/* ── Toast ─────────────────────────────── */
/* Purement informatif : il ne doit jamais intercepter un appui,
   sans quoi il rend inertes les boutons qu'il recouvre. */
.toast{pointer-events:none;position:fixed;z-index:40;left:16px;right:16px;bottom:calc(78px + var(--safe-b));
  background:var(--slate-3);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;font-size:14px;font-weight:600;text-align:center;
  animation:rise .2s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.45)}

.empty{text-align:center;padding:46px 20px;color:var(--faint)}
.empty__t{font-size:15.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.empty__s{font-size:13.5px;line-height:1.55}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════════════════════════════════════
   Écran Statut
   ═══════════════════════════════════════════ */

.banner{background:var(--slate-2);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:11px}
.banner b{color:var(--text);font-weight:700}
.banner--warn{background:var(--sodium-dim);border-color:#5C4715;color:#F0D9A8}
.banner--warn b{color:var(--sodium)}

.card--urgent{border-color:#5C4715;background:linear-gradient(var(--sodium-dim),var(--sodium-dim)) padding-box,var(--slate)}

.pill{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap;flex:none;
  background:var(--slate-3);color:var(--muted)}
.pill--warn{background:var(--sodium-dim);color:var(--sodium)}
.pill--bad{background:var(--rose-dim);color:var(--rose)}
.pill--ok{background:var(--mint-dim);color:var(--mint)}

.deadline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.deadline__d{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:600;line-height:1.15}
.deadline__d::first-letter{text-transform:uppercase}
.deadline__s{font-size:12px;color:var(--faint);margin-top:2px}

/* Le montant à recopier : la raison d'être de l'écran */
.copybox{background:var(--slate-2);border:1px solid var(--line);border-radius:12px;
  padding:15px;text-align:center;margin-bottom:12px}
.copybox__k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.copybox__v{font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:700;
  color:var(--sodium);line-height:1.05;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.copybox .btn{margin-top:0}

.meter{margin-bottom:16px}
.meter:last-child{margin-bottom:0}
.meter__top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13px;color:var(--muted);margin-bottom:7px}
.meter__top b{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;
  color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter__s{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.5}

.gauge{height:9px;border-radius:99px;background:var(--slate-3);overflow:hidden}
.gauge__fill{height:100%;border-radius:99px;transition:width .5s ease}
.gauge__fill.ok{background:var(--mint)}
.gauge__fill.warn{background:var(--sodium)}
.gauge__fill.bad{background:var(--rose)}

/* Démarches */
.step{border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step__h{display:flex;align-items:flex-start;gap:11px;padding:13px 0;cursor:pointer}
.step__t{flex:1;min-width:0}
.step__title{font-size:14.5px;font-weight:600;line-height:1.35}
.step__when{font-size:11.5px;color:var(--faint);margin-top:2px}
.step.is-done .step__title{color:var(--faint);text-decoration:line-through}

.check{width:23px;height:23px;flex:none;margin-top:1px;border-radius:7px;
  border:1.5px solid var(--slate-3);background:none;cursor:pointer;position:relative;transition:.16s}
.check.on{background:var(--mint);border-color:var(--mint)}
.check.on::after{content:'';position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid #04342C;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}

.tag{display:inline-block;font-size:10px;font-weight:700;background:var(--rose-dim);color:var(--rose);
  padding:2px 7px;border-radius:99px;margin-right:6px;letter-spacing:.02em;white-space:nowrap}
.step__when{display:flex;align-items:center;flex-wrap:wrap;gap:2px}

.step__body{display:none;padding:0 0 15px 34px}
.step.open .step__body{display:block}
.step__why{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 11px}
.step__list{margin:0 0 11px;padding-left:19px;font-size:13px;color:var(--muted);line-height:1.65}
.step__list li{margin-bottom:5px}
.step__prep{font-size:12.5px;color:var(--faint);margin:0 0 5px;line-height:1.55}
.step__prep b{color:var(--muted);font-weight:600}

/* Glossaire */
.fiche{border-bottom:1px solid var(--line)}
.fiche:last-child{border-bottom:none}
.fiche summary{padding:12px 0;font-size:14.5px;font-weight:600;cursor:pointer;list-style:none;
  display:flex;align-items:center;justify-content:space-between}
.fiche summary::-webkit-details-marker{display:none}
.fiche summary::after{content:'+';color:var(--faint);font-size:19px;font-weight:400;flex:none;margin-left:10px}
.fiche[open] summary::after{content:'−'}
.fiche p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.65}

input[type=date]{width:100%;background:var(--slate-2);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font-family:'Manrope',sans-serif;font-size:15px;font-weight:600;
  padding:12px 14px;outline:none;-webkit-appearance:none}
input[type=date]:focus{border-color:var(--sodium)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.65)}

.tabbar button{font-size:9.5px}

/* Message affiché quand le fond de carte fait défaut :
   informatif, jamais bloquant. */
.map-notice{position:absolute;z-index:2;left:24px;right:24px;top:50%;transform:translateY(-50%);
  text-align:center;font-size:13px;line-height:1.6;color:var(--faint)}

.diag{font-family:var(--font-mono,ui-monospace,monospace);font-size:11.5px;line-height:1.7;
  background:var(--slate-2);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;color:var(--muted);white-space:pre-wrap;word-break:break-word;margin-bottom:11px}

/* ═══════════════════════════════════════════
   Grand objectif
   ═══════════════════════════════════════════ */

.goal .card__h{margin-bottom:6px}
.goal__row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.goal__big{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;
  line-height:1;font-variant-numeric:tabular-nums}
.goal__sub{font-size:13px;color:var(--muted);margin-top:3px}
.goal__scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:5px}

/* Le chiffre qui compte vraiment : combien aujourd'hui */
.goal__target{background:var(--slate-2);border:1px solid var(--line);border-radius:12px;
  padding:14px;text-align:center;margin:14px 0 12px}
.goal__tk{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.goal__tv{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:700;
  color:var(--sodium);line-height:1.05;margin:2px 0;font-variant-numeric:tabular-nums}
.goal__ts{font-size:12px;color:var(--faint);line-height:1.5}

.goal__today{margin-top:4px}
.goal__trow{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;color:var(--muted);margin-bottom:6px}
.goal__trow b{font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--text);
  font-variant-numeric:tabular-nums}
.goal__today .goal__ts{margin-top:6px}

/* Sélecteur de jours travaillables */
.daylbl{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:4px 0 8px}
.daypick{display:flex;gap:6px;margin-bottom:12px}
.daypick button{flex:1;aspect-ratio:1;min-width:0;background:var(--slate-2);
  border:1px solid var(--line);border-radius:10px;color:var(--faint);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;padding:0}
.daypick button.on{background:var(--sodium);border-color:var(--sodium);color:#20160A}
.daypick button:active{transform:scale(.93)}

/* Bandeau d'objectif sur l'écran Course */
.goalbar{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.goalbar__row{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12.5px;color:var(--muted);margin-bottom:6px}
.goalbar__row b{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;
  color:var(--sodium);font-variant-numeric:tabular-nums}

/* Démarche écartée */
.step.is-na{opacity:.45}
.step.is-na .step__title{text-decoration:none}
.step__na{display:block;width:100%;background:none;border:none;color:var(--faint);
  font-family:inherit;font-size:12.5px;padding:8px 0 0;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-align:left}
.check.na{background:var(--slate-3);border-color:var(--slate-3);position:relative}
.check.na::after{content:'';position:absolute;left:5px;top:9.5px;width:11px;height:2px;
  background:var(--faint);border:none;transform:none}

</style>
</head>
<body>

<div id="app">

  <!-- ══ ÉCRAN COURSE ══ -->
  <section class="screen screen--course is-active" id="screen-course">

    <div id="map" aria-label="Carte de la tournée"></div>
    <div class="map-veil" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbar__status">
        <span class="dot" id="status-dot"></span>
        <span id="status-label">Hors service</span>
      </div>
      <div class="topbar__right">
        <span class="chrono" id="chrono">00:00</span>
        <button class="iconbtn" id="btn-recenter" aria-label="Recentrer la carte">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <div class="gps-warn" id="gps-warn" hidden></div>
    <div class="map-notice" id="map-notice" hidden></div>

    <!-- Feuille du bas -->
    <div class="sheet" id="sheet">
      <div class="sheet__grip" aria-hidden="true"></div>

      <!-- État : hors service -->
      <div class="pane is-active" id="pane-idle">
        <p class="pane__lead">Lance ton shift pour commencer à compter.</p>
        <button class="btn btn--go" id="btn-start-shift">Démarrer le shift</button>
        <div class="recap" id="recap-idle"></div>
      </div>

      <!-- État : shift actif, en attente d'une course -->
      <div class="pane" id="pane-ready">
        <button class="btn btn--go" id="btn-open-offer">Nouvelle course</button>
        <button class="btn btn--ghost" id="btn-end-shift">Terminer le shift</button>
      </div>

      <!-- État : course en cours -->
      <div class="pane" id="pane-running">
        <div class="running">
          <div class="running__amount">
            <span class="num" id="run-amount">—</span>
            <span class="unit">€</span>
          </div>
          <span class="verdict-chip" id="run-chip"></span>
        </div>
        <p class="running__sub" id="run-sub">0,00 km parcourus</p>
        <button class="btn btn--go" id="btn-deliver">Course livrée</button>
        <button class="btn btn--ghost btn--quiet" id="btn-cancel-course">Annuler la course</button>
      </div>

      <div class="figures figures--foot" id="figures-foot"></div>
      <div class="goalbar" id="goalbar" hidden></div>
    </div>
  </section>

  <!-- ══ ÉCRAN HISTORIQUE ══ -->
  <section class="screen screen--scroll" id="screen-history">
    <h1 class="title">Historique</h1>
    <div id="history-list"></div>
  </section>

  <!-- ══ ÉCRAN STATUT ══ -->
  <section class="screen screen--scroll" id="screen-admin">
    <h1 class="title">Statut</h1>
    <div id="admin-body"></div>
  </section>

  <!-- ══ ÉCRAN STATS ══ -->
  <section class="screen screen--scroll" id="screen-stats">
    <h1 class="title">Stats</h1>
    <div class="segmented" id="stats-range">
      <button data-range="7" class="is-on">7 jours</button>
      <button data-range="30">30 jours</button>
      <button data-range="9999">Tout</button>
    </div>
    <div id="stats-body"></div>
  </section>

  <!-- ══ ÉCRAN RÉGLAGES ══ -->
  <section class="screen screen--scroll" id="screen-settings">
    <h1 class="title">Réglages</h1>
    <div id="settings-body"></div>
  </section>

  <!-- ══ BARRE D'ONGLETS ══ -->
  <nav class="tabbar" id="tabbar">
    <button data-tab="course" class="is-on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>
      <span>Course</span>
    </button>
    <button data-tab="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 14l2 2 4-4"/></svg>
      <span>Statut</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
      <span>Courses</span>
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Stats</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

</div>

<!-- ══ MODALE : ÉVALUER UNE OFFRE ══ -->
<div class="modal" id="modal-offer" hidden>
  <div class="modal__card">
    <div class="modal__grip" aria-hidden="true"></div>
    <h2>Cette course, tu la prends ?</h2>
    <div class="fieldrow">
      <label class="field">
        <span>Montant proposé</span>
        <div class="inputwrap"><input type="number" inputmode="decimal" step="0.01" id="offer-amount" placeholder="0,00"><i>€</i></div>
      </label>
      <label class="field">
        <span>Distance annoncée</span>
        <div class="inputwrap"><input type="number" inputmode="decimal" step="0.1" id="offer-km" placeholder="0,0"><i>km</i></div>
      </label>
    </div>
    <label class="field">
      <span>Plateforme</span>
      <select id="offer-platform"></select>
    </label>

    <div class="verdict" id="offer-verdict">
      <div class="verdict__head">
        <span class="verdict__word" id="verdict-word">—</span>
        <span class="verdict__rate" id="verdict-rate"></span>
      </div>
      <div class="verdict__lines" id="verdict-lines"></div>
    </div>

    <div class="modal__actions">
      <button class="btn btn--ghost" data-close="modal-offer">Refuser</button>
      <button class="btn btn--go" id="btn-accept-offer">Démarrer</button>
    </div>
    <button class="linkbtn" id="btn-skip-offer">Démarrer sans évaluer</button>
  </div>
</div>

<!-- ══ MODALE : CLÔTURE DE COURSE ══ -->
<div class="modal" id="modal-close" hidden>
  <div class="modal__card">
    <div class="modal__grip" aria-hidden="true"></div>
    <h2>Course terminée</h2>
    <p class="modal__sub" id="close-tracked"></p>
    <div class="fieldrow">
      <label class="field">
        <span>Montant encaissé</span>
        <div class="inputwrap"><input type="number" inputmode="decimal" step="0.01" id="close-amount" placeholder="0,00"><i>€</i></div>
      </label>
      <label class="field">
        <span>Pourboire</span>
        <div class="inputwrap"><input type="number" inputmode="decimal" step="0.01" id="close-tip" placeholder="0,00"><i>€</i></div>
      </label>
    </div>
    <label class="field">
      <span>Distance retenue</span>
      <div class="inputwrap"><input type="number" inputmode="decimal" step="0.1" id="close-km"><i>km</i></div>
    </label>
    <div class="modal__actions">
      <button class="btn btn--ghost" data-close="modal-close">Retour</button>
      <button class="btn btn--go" id="btn-save-course">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ══ MODALE : RETOUCHE D'UNE COURSE ══ -->
<div class="modal" id="modal-edit" hidden>
  <div class="modal__card">
    <div class="modal__grip" aria-hidden="true"></div>
    <h2>Modifier la course</h2>
    <div class="fieldrow">
      <label class="field">
        <span>Montant</span>
        <div class="inputwrap"><input type="number" inputmode="decimal" step="0.01" id="edit-amount"><i>€</i></div>
      </label>
      <label class="field">
        <span>Pourboire</span>
        <div class="inputwrap"><input type="number" inputmode="decimal" step="0.01" id="edit-tip"><i>€</i></div>
      </label>
    </div>
    <label class="field">
      <span>Distance</span>
      <div class="inputwrap"><input type="number" inputmode="decimal" step="0.1" id="edit-km"><i>km</i></div>
    </label>
    <div class="modal__actions">
      <button class="btn btn--danger" id="btn-delete-course">Supprimer</button>
      <button class="btn btn--go" id="btn-update-course">Enregistrer</button>
    </div>
    <button class="linkbtn" data-close="modal-edit">Annuler</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ═══════════════════════════════════════════
   store.js — persistance locale
   Tout reste sur l'appareil. Aucun serveur.
   ═══════════════════════════════════════════ */

const Store = (() => {

  const KEY = 'tournee.v1';

  /* Coût au km et vitesse moyenne par véhicule.
     Ce ne sont que des points de départ : l'utilisateur
     peut tout écraser dans les réglages. */
  const VEHICLES = {
    pied:    { label: 'À pied',           cost: 0.00, speed: 5  },
    velo:    { label: 'Vélo mécanique',   cost: 0.04, speed: 15 },
    vae:     { label: 'Vélo électrique',  cost: 0.07, speed: 18 },
    scooter: { label: 'Scooter',          cost: 0.15, speed: 24 },
    moto:    { label: 'Moto',             cost: 0.20, speed: 28 },
    voiture: { label: 'Voiture',          cost: 0.35, speed: 22 }
  };

  /* Les taux, seuils et échéances ne vivent plus ici :
     ils sont chargés depuis data/reglementation.json par Rules,
     pour rester modifiables sans toucher au code. */

  const DEFAULTS = {
    settings: {
      vehicle: 'vae',
      costPerKm: 0.07,
      avgSpeed: 18,
      thresholdPerKm: 1.20,   // seuil d'acceptation en €/km
      minFare: 4.00,          // course minimum acceptable
      cotisationRate: 21.2,   // % du CA encaissé
      provisionRate: 25,      // % du CA à mettre de côté (social + impôt)
      hourlyGoal: 15,         // objectif net €/h
      dailyGoal: 80,          // objectif net €/jour
      platforms: ['Uber Eats', 'Deliveroo'],
      lastPlatform: 'Uber Eats',
      // — Statut administratif —
      dateDebut: '',            // date de début d'activité (AAAA-MM-JJ)
      regimeId: 'bic_serv',     // identifiant d'un régime du fichier de réglementation
      acreActive: false,        // exonération ACRE en cours
      periodicite: 'trimestrielle',
      // — Objectif de chiffre —
      goalEnabled: true,
      goalAmount: 35000,        // montant visé sur la période
      goalBasis: 'brut',        // 'brut' (CA encaissé) ou 'net' (après charges)
      goalStart: '',            // vide = 1er janvier de l'année en cours
      goalEnd: '',              // vide = 31 décembre de l'année en cours
      goalDays: [1, 2, 3, 4, 5],// jours travaillables, 0 = dimanche … 6 = samedi
      autoDistance: true,     // mesurer les km au GPS
      keepAwake: true,        // garder l'écran allumé en course
      countReturn: false      // compter le trajet de retour à vide
    },
    sessions: [],   // { id, start, end }
    courses: [],    // { id, sessionId, platform, start, end, km, amount, tip, offerKm, offerAmount }
    active: null,   // { sessionId, courseId, courseStart, offerAmount, offerKm, platform }
    checklist: {},  // { [idDeLEtape]: { s: 'fait' | 'na', t: horodatage } }
    meta: { version: 1, created: null }
  };

  let db = null;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function load() {
    if (db) return db;
    try {
      const raw = localStorage.getItem(KEY);
      db = raw ? JSON.parse(raw) : clone(DEFAULTS);
    } catch (e) {
      db = clone(DEFAULTS);
    }
    // Fusion : garantit que les réglages ajoutés dans une version
    // ultérieure existent bien sur une base déjà en place.
    db.settings = Object.assign({}, DEFAULTS.settings, db.settings || {});
    db.sessions  = db.sessions  || [];
    db.courses   = db.courses   || [];
    db.checklist = db.checklist || {};
    db.meta      = Object.assign({}, DEFAULTS.meta, db.meta || {});
    if (!db.meta.created) db.meta.created = Date.now();
    return db;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
    } catch (e) {
      console.warn('Sauvegarde impossible', e);
    }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ── Réglages ─────────────────────────── */
  function settings() { return load().settings; }

  function setSetting(key, value) {
    load().settings[key] = value;
    save();
  }

  /* ── Shifts ───────────────────────────── */
  function openSession() {
    const d = load();
    const s = { id: uid(), start: Date.now(), end: null };
    d.sessions.push(s);
    d.active = { sessionId: s.id, courseId: null };
    save();
    return s;
  }

  function closeSession() {
    const d = load();
    if (!d.active) return null;
    const s = d.sessions.find(x => x.id === d.active.sessionId);
    if (s) s.end = Date.now();
    d.active = null;
    save();
    return s;
  }

  function activeSession() {
    const d = load();
    if (!d.active) return null;
    return d.sessions.find(x => x.id === d.active.sessionId) || null;
  }

  function active() { return load().active; }

  function setActive(patch) {
    const d = load();
    d.active = d.active ? Object.assign(d.active, patch) : patch;
    save();
  }

  /* ── Courses ──────────────────────────── */
  function startCourse(offer) {
    const d = load();
    if (!d.active) return null;
    d.active.courseId    = uid();
    d.active.courseStart = Date.now();
    d.active.offerAmount = offer && offer.amount != null ? offer.amount : null;
    d.active.offerKm     = offer && offer.km != null ? offer.km : null;
    d.active.platform    = (offer && offer.platform) || d.settings.lastPlatform;
    save();
    return d.active.courseId;
  }

  function saveCourse(data) {
    const d = load();
    const c = {
      id: d.active && d.active.courseId ? d.active.courseId : uid(),
      sessionId: d.active ? d.active.sessionId : null,
      platform: data.platform || d.settings.lastPlatform,
      start: (d.active && d.active.courseStart) || Date.now(),
      end: Date.now(),
      km: Number(data.km) || 0,
      amount: Number(data.amount) || 0,
      tip: Number(data.tip) || 0,
      offerKm: d.active ? d.active.offerKm : null,
      offerAmount: d.active ? d.active.offerAmount : null
    };
    d.courses.push(c);
    if (d.active) {
      d.active.courseId = null;
      d.active.courseStart = null;
      d.active.offerAmount = null;
      d.active.offerKm = null;
    }
    d.settings.lastPlatform = c.platform;
    save();
    return c;
  }

  function abortCourse() {
    const d = load();
    if (!d.active) return;
    d.active.courseId = null;
    d.active.courseStart = null;
    d.active.offerAmount = null;
    d.active.offerKm = null;
    save();
  }

  function updateCourse(id, patch) {
    const c = load().courses.find(x => x.id === id);
    if (!c) return null;
    Object.assign(c, patch);
    save();
    return c;
  }

  function deleteCourse(id) {
    const d = load();
    d.courses = d.courses.filter(x => x.id !== id);
    save();
  }

  function courses()  { return load().courses; }
  function sessions() { return load().sessions; }

  function coursesOf(sessionId) {
    return load().courses.filter(c => c.sessionId === sessionId)
                         .sort((a, b) => a.start - b.start);
  }

  /* ── Suivi des démarches ──────────────── */

  /* Trois états possibles : à faire, fait, ou hors sujet.
     Le troisième évite de laisser traîner une étape qui ne
     concerne pas la personne, comme l'ACRE sans éligibilité. */
  function checklist() {
    const c = load().checklist;
    // Reprise des anciennes données, où la valeur était un horodatage nu.
    Object.keys(c).forEach(k => {
      if (typeof c[k] === 'number') c[k] = { s: 'fait', t: c[k] };
    });
    return c;
  }

  function stepState(id) {
    const v = checklist()[id];
    return v ? v.s : null;
  }

  function setStep(id, state) {
    const d = load();
    if (!state) delete d.checklist[id];
    else d.checklist[id] = { s: state, t: Date.now() };
    save();
    return state;
  }

  function toggleCheck(id) {
    return setStep(id, stepState(id) === 'fait' ? null : 'fait');
  }

  /* ── Sauvegarde / restauration ────────── */
  function exportJSON() {
    return JSON.stringify(load(), null, 2);
  }

  function importJSON(text) {
    const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.courses)) {
      throw new Error('Fichier non reconnu');
    }
    db = parsed;
    db.settings = Object.assign({}, DEFAULTS.settings, db.settings || {});
    db.sessions  = db.sessions  || [];
    db.checklist = db.checklist || {};
    db.meta      = Object.assign({}, DEFAULTS.meta, db.meta || {});
    save();
  }

  function wipe() {
    db = clone(DEFAULTS);
    db.meta.created = Date.now();
    save();
  }

  return {
    VEHICLES,
    settings, setSetting,
    openSession, closeSession, activeSession, active, setActive,
    startCourse, saveCourse, abortCourse, updateCourse, deleteCourse,
    courses, sessions, coursesOf,
    checklist, stepState, setStep, toggleCheck,
    exportJSON, importJSON, wipe
  };

})();
